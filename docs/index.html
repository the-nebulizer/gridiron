<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gridiron — Battle for the Gridiron Throne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Graduate&family=Barlow+Semi+Condensed:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<script type="text/javascript">try{const t=localStorage.getItem('gridiron.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch{}</script>
<script src="marked.min.js"></script>
<style>
  :root{
    --bg:#0C1D12; --surface-1:#15291C; --surface-2:#182F20; --surface-3:#1F3A28;
    --line:#24422F; --line-soft:#1C3323;
    --text:#F2F5EB; --text-2:#A8BCA9; --text-3:#6F8873;
    --accent:#FFB41F; --accent-ink:#1A1200; --accent-bg:rgba(255,180,31,.12);
    --danger:#F0503A; --ok:#5EC4A0; --ok-text:#5EC4A0;
    --qb:#E8615A; --rb:#5EC4A0; --wr:#5AA9E6; --te:#E8A33D; --k:#B48CE8; --def:#8B9AA8;
    --turf:var(--bg); --pitch:var(--surface-1); --pitch-2:var(--surface-2); --chalk:var(--text); --chalk-dim:var(--text-2); --amber:var(--accent); --flag:var(--danger);
    --display:'Graduate',serif; --body:'Barlow Semi Condensed',system-ui,sans-serif; --mono:'Spline Sans Mono',ui-monospace,monospace;
    --pad:16px; --r:3px; --row:44px; --fold:52px;
    color-scheme:dark;
  }
  @media (prefers-color-scheme:light){
    :root:not([data-theme="dark"]){
      --bg:#F4F6F1; --surface-1:#FFFFFF; --surface-2:#EEF2EA; --surface-3:#E3E9DF;
      --line:#CFD9CC; --line-soft:#E2E8DE;
      --text:#10201A; --text-2:#4C6152; --text-3:#5F7468;
      --accent:#9A6608; --accent-ink:#FFFFFF; --accent-bg:#FFF3D6;
      --danger:#C93A28; --ok:#1F8F6A; --ok-text:#1A7A5A;
      --qb:#C4413B; --rb:#1F8F6A; --wr:#2B7EC2; --te:#B7780A; --k:#7B58C9; --def:#5E6D7B;
      color-scheme:light;
    }
  }
  :root[data-theme="light"]{
    --bg:#F4F6F1; --surface-1:#FFFFFF; --surface-2:#EEF2EA; --surface-3:#E3E9DF;
    --line:#CFD9CC; --line-soft:#E2E8DE;
    --text:#10201A; --text-2:#4C6152; --text-3:#5F7468;
    --accent:#9A6608; --accent-ink:#FFFFFF; --accent-bg:#FFF3D6;
    --danger:#C93A28; --ok:#1F8F6A; --ok-text:#1A7A5A;
    --qb:#C4413B; --rb:#1F8F6A; --wr:#2B7EC2; --te:#B7780A; --k:#7B58C9; --def:#5E6D7B;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  html{scroll-padding-top:var(--top-h,48px);scroll-padding-bottom:var(--rail-h,0px)}
  body{background:var(--bg);color:var(--text);font:15px/1.45 var(--body);overflow-x:hidden}
  a{color:var(--text);text-decoration-color:var(--line)}
  a:hover,a:focus-visible{text-decoration-color:var(--accent)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button{font-family:inherit}
  [data-pos="QB"]{--pos:var(--qb)} [data-pos="RB"]{--pos:var(--rb)} [data-pos="WR"]{--pos:var(--wr)}
  [data-pos="TE"]{--pos:var(--te)} [data-pos="K"]{--pos:var(--k)} [data-pos="DEF"]{--pos:var(--def)}
  .pos-tag{background:color-mix(in srgb,var(--pos,var(--text-3)) 16%,transparent);color:var(--pos,var(--text-3))}

  /* masthead + nav */
  .top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:16px;min-height:48px;padding:0 24px}
  .wordmark{font:18px var(--display);letter-spacing:.04em;white-space:nowrap}
  .wordmark .throne{color:var(--accent)}
  .weekchip{font:12px var(--mono);color:var(--text-2);white-space:nowrap}
  .weekchip .short{display:none}
  .nav{display:flex;gap:2px;margin-left:auto}
  .nav a{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 14px;font:600 13px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--text-2);text-decoration:none}
  .nav a:hover{color:var(--text)}
  .nav a[aria-current]{color:var(--text);box-shadow:inset 0 -2px 0 var(--accent)}
  .nbadge{background:var(--accent);color:var(--accent-ink);border-radius:9px;min-width:18px;padding:0 5px;font:600 11px/18px var(--mono);text-align:center}
  .nbadge[hidden]{display:none}
  button.theme,button.refresh{font:12px var(--mono);background:none;border:1px solid var(--line);border-radius:3px;color:var(--text-2);padding:0 10px;min-height:32px;cursor:pointer;white-space:nowrap}
  button.theme:hover,button.refresh:hover{border-color:var(--accent);color:var(--text)}

  main#app{max-width:1280px;margin:0 auto;padding:0 24px}
  .views{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(380px,1fr);grid-template-areas:"do week" "brief league";gap:1px;background:var(--line-soft);align-items:stretch}
  #do{grid-area:do} #week{grid-area:week} #league{grid-area:league} #brief{grid-area:brief}
  .view{background:var(--bg);padding:8px var(--pad) 24px;min-width:0}
  .notice{font:12px var(--mono);color:var(--text-2);border:1px solid var(--line);border-radius:3px;padding:8px 14px;margin:12px 24px 0}
  .loading,.error{padding:70px 0;text-align:center;color:var(--text-2);font:15px var(--mono)}
  .error b{color:var(--danger)}
  .dim{color:var(--text-3)}
  .missed{color:var(--danger)}
  .sub{font-size:13px;color:var(--text-2);margin:0 0 12px}
  .allclear{padding:16px 0;color:var(--text-2)}

  /* week */
  .callline{font-size:13px;color:var(--text-2);margin:4px 0 10px;line-height:1.4}
  .callline b{color:var(--text);font-weight:600}
  .scorebug{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;background:var(--surface-1);border-radius:3px;height:64px}
  .side{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px;min-width:0}
  .side.opp{flex-direction:row-reverse;text-align:right}
  .side .who{min-width:0}
  .side .team{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side .rec{font:11px var(--mono);color:var(--text-2)}
  .side .pts{font:28px/1 var(--mono);font-variant-numeric:tabular-nums}
  .vs{font:11px var(--display);color:var(--text-2);padding:0 8px}
  .lineup{margin-top:10px}
  .lhead,.lrow{display:grid;grid-template-columns:44px minmax(0,1fr) 48px 48px minmax(0,1fr);align-items:center}
  .lhead{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);padding:4px 0}
  .lhead .r{text-align:right;padding-right:6px}
  .lrow{min-height:40px;border-top:1px solid var(--line-soft);padding:2px 0}
  .slot{font:11px var(--mono);text-align:center;border-radius:3px;padding:2px 0;margin-right:8px;background:color-mix(in srgb,var(--pos,var(--text-3)) 16%,transparent);color:var(--pos,var(--text-2))}
  .pc{min-width:0}
  .pc.opp{padding-left:8px}
  .pl{display:flex;align-items:baseline;gap:6px;min-width:0}
  .pname{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .kick{font-size:11px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kick.live{color:var(--accent)}
  .lrow .pts{font:13px var(--mono);font-variant-numeric:tabular-nums;text-align:right;padding-right:6px;color:var(--text-2)}
  .badge{font:600 10px var(--mono);padding:0 5px;border:1px solid;border-radius:3px;flex-shrink:0}
  .badge.q{color:var(--accent);border-color:var(--accent)}
  .badge.out{color:var(--danger);border-color:var(--danger)}
  .lineup.solo .lhead,.lineup.solo .lrow{grid-template-columns:44px minmax(0,1fr) 48px}
  .nogame{padding:8px 0;color:var(--text-2);font-size:13px}
  .benchnote{font-size:14px;color:var(--text-2);line-height:1.7}
  .benchnote b{color:var(--text);font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{font:600 11px var(--body);letter-spacing:.08em;color:var(--text-3);text-align:left;padding:6px 8px 6px 0;border-bottom:1px solid var(--line-soft);text-transform:uppercase}
  th.r{text-align:right}
  td{padding:0 8px 0 0;height:32px;border-bottom:1px solid var(--line-soft)}
  td.num{font:12px var(--mono);font-variant-numeric:tabular-nums;text-align:right;color:var(--text-2)}
  tr.me{background:var(--accent-bg)}
  tr.me td:first-child{box-shadow:inset 2px 0 var(--accent);padding-left:8px}
  tr.me td{font-weight:600}

  /* league activity */
  .tx{display:flex;gap:2px 12px;align-items:baseline;flex-wrap:wrap;min-height:40px;padding:6px 0;border-top:1px solid var(--line-soft);font-size:14px}
  .tx:first-child{border-top:0}
  .tx .who{font-weight:600}
  .tx .did{color:var(--text-2);flex:1;min-width:180px}
  .tx .did .in{color:var(--text)}
  .tx .when{font:12px var(--mono);color:var(--text-3);margin-left:auto}
  .free{font:600 11px var(--body);letter-spacing:.1em;color:var(--ok-text);border:1px solid var(--ok);border-radius:3px;padding:0 6px;margin-left:6px}

  /* brief */
  .tabs{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--line-soft);margin-top:4px}
  .tab{font:600 13px var(--body);letter-spacing:.08em;text-transform:uppercase;min-height:44px;padding:0 14px;background:none;border:0;color:var(--text-2);white-space:nowrap;cursor:pointer}
  .tab:hover{color:var(--text)}
  .tab:focus-visible{outline-offset:-3px}
  .tab[aria-selected="true"]{color:var(--text);box-shadow:inset 0 -2px 0 var(--accent)}
  .verdict{font:600 15px/1.35 var(--body);margin:12px 0 4px}
  .verdict .stale{font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);border:1px solid var(--line);border-radius:3px;padding:0 6px;margin-left:8px;vertical-align:middle}
  .brief-meta{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap;padding:6px 0 10px;font:12px var(--mono);color:var(--text-3)}
  .brief-meta .links{display:flex;gap:12px}
  .empty{padding:16px 0;color:var(--text-2)}
  .report{max-width:70ch}
  .report h1,.report h2,.report h3{font:600 15px/1.35 var(--body);color:var(--text);margin:14px 0 6px;text-transform:none;letter-spacing:0}
  .report p,.report li{font-size:14px;color:var(--text)}
  .report em{color:var(--text-2)}
  .report strong{font-weight:600}
  .report code{font:12px var(--mono);background:var(--surface-2);padding:1px 5px;border-radius:3px}
  .report blockquote{margin:10px 0;padding:2px 14px;border-left:2px solid var(--line);color:var(--text-2)}
  .report table{font-size:13px;display:block;overflow-x:auto}
  details.sec{border-top:1px solid var(--line-soft)}
  details.sec>summary{display:flex;align-items:center;min-height:44px;font:600 15px var(--body);cursor:pointer;list-style:none}
  details.sec>summary::-webkit-details-marker{display:none}
  details.sec>summary::after{content:'+';margin-left:auto;font:14px var(--mono);color:var(--text-3)}
  details.sec[open]>summary::after{content:'−';color:var(--accent)}
  details.sec>div{padding-bottom:10px}

  /* phone rail */
  .rail{display:none;position:sticky;bottom:0;z-index:25;background:var(--surface-1);border-top:1px solid var(--line);min-height:56px;padding:6px 16px calc(6px + env(safe-area-inset-bottom));align-items:center;gap:12px}
  .rail .rtxt{min-width:0;flex:1}
  .rail .eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;color:var(--text-2)}
  .rail .eyebrow .flag{font:600 10px var(--body);letter-spacing:.08em;color:var(--danger);border:1px solid var(--danger);border-radius:3px;padding:0 5px;white-space:nowrap}
  .rail .rhead{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:14px}
  .rail .rhead .meta{display:none}
  .rail a.go{background:var(--accent);color:var(--accent-ink);min-height:44px;padding:0 14px;display:inline-flex;align-items:center;font:600 13px var(--body);letter-spacing:.06em;text-transform:uppercase;border-radius:3px;text-decoration:none;white-space:nowrap}
  .rail.idle a.go{background:var(--surface-3);color:var(--text-2)}

  footer{max-width:1280px;margin:0 auto;padding:20px 24px 32px;font:12px var(--mono);color:var(--text-3);border-top:1px solid var(--line-soft)}
  footer a{color:var(--text-2)}

  @media (max-width:1099.98px){
    .views{display:block;background:none}
    body:not([data-view="do"]) #do,body:not([data-view="week"]) #week,body:not([data-view="league"]) #league,body:not([data-view="brief"]) #brief{display:none}
    .top{flex-wrap:wrap;gap:0 12px;padding:0 16px}
    .top>*:not(.nav){min-height:44px;display:flex;align-items:center;gap:4px}
    .weekchip{margin-left:auto}
    .nav{order:5;flex:1 0 100%;margin:0;border-top:1px solid var(--line-soft)}
    .nav a{flex:1;min-height:48px}
    main#app{padding:0}
    .notice{margin:12px 16px 0}
    footer{padding:20px 16px 32px}
  }
  @media (max-width:719.98px){
    body{font-size:14px}
    .wordmark .throne,.weekchip .long{display:none}
    .weekchip .short{display:inline}
    button.theme,button.refresh{min-height:44px}
    .rail{display:flex}
    main#app{min-height:calc(100vh - 96px);display:flex;flex-direction:column}
    .views{flex:1}
    .lrow{min-height:44px}
    .lrow .sd,.lrow .tv{display:none}
    .side .pts{font-size:24px}
    .tab{padding:0 10px;letter-spacing:.04em}
  }
  @media (max-width:399.98px){
    .top{gap:0 8px}
    #stamp{display:none}
    button.refresh{min-width:44px;padding:0 8px}
    .tab{padding:0 8px;font-size:12px}
  }
  @media (max-width:339.98px){
    .tab{padding:0 6px;font-size:11px;letter-spacing:.02em}
  }

  /* ——— the card: rendered by renderDoNow. ask/template.html carries an identical copy of this
     block (between the card-css markers) — keep the two in step. ——— */
  /* card-css:start */
  .phead{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px;padding:8px 0 4px}
  .eyebrow{font:600 11px/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--text-3)}
  .dcount{font:12px var(--mono);color:var(--text-2)}
  .dcount b{color:var(--accent);font-weight:500}
  .dlinks{display:flex;gap:12px;font:12px var(--mono);white-space:nowrap}
  .dlinks a{display:inline-flex;align-items:center;min-height:44px;margin:-14px -6px;padding:0 6px;color:var(--text);text-decoration:underline;text-decoration-color:var(--line)}
  .dlinks a:hover{text-decoration-color:var(--accent)}
  .runlink{display:inline-flex;align-items:center;min-height:44px;margin:-15px -6px;padding:0 6px;font:12px var(--mono);color:var(--text);text-decoration:underline;text-decoration-color:var(--line);white-space:nowrap}
  .plan{border-left:2px solid var(--accent-bg);margin:0 0 12px}
  .act{border-bottom:1px solid var(--line-soft)}
  .act:last-child{border-bottom:0}
  details.act>summary,div.act{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:2px 8px;padding:10px 8px 10px 10px;align-items:start}
  details.act>summary{cursor:pointer;list-style:none}
  details.act>summary::-webkit-details-marker{display:none}
  details.act>summary:hover .move{text-decoration:underline;text-decoration-color:var(--line)}
  .act .glyph{font:14px/1.5 var(--mono);color:var(--accent)}
  .act .move{font-weight:600;font-size:15px;line-height:1.35;min-width:0;overflow-wrap:anywhere}
  .plan>.act:first-child .move{font-size:17px}
  .act .move .meta{font:12px var(--mono);font-weight:400;color:var(--text-3)}
  .act .chip{font:12px var(--mono);color:var(--accent);white-space:nowrap;align-self:start;padding-top:2px}
  details.act .chip::after{content:' ▸'}
  details.act[open] .chip::after{content:' ▾'}
  .act .kind{font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-right:8px;vertical-align:middle}
  .act .lead{font:12px var(--mono);font-weight:400;color:var(--text-3);margin-right:8px}
  .act .flag{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--danger);border:1px solid var(--danger);border-radius:3px;padding:0 6px;margin-left:8px;white-space:nowrap;vertical-align:middle}
  .act .why{grid-column:2/-1;font-size:14px;line-height:1.4;color:var(--text-2)}
  div.act>.src{grid-column:2/-1}
  details.act>summary .why{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
  details.act[open]>summary .why{display:block;-webkit-line-clamp:unset;overflow:visible}
  .act.waiting .glyph,.act.superseded .glyph,.act.stale .glyph,.act.gone .glyph{color:var(--text-3)}
  .act.done .glyph{color:var(--ok)}
  .act.waiting .move,.act.superseded .move,.act.stale .move,.act.gone .move,.act.done .move{color:var(--text-2);font-weight:500}
  .act.waiting .kind,.act.superseded .kind,.act.stale .kind,.act.done .kind,.act.gone .kind{color:var(--text-3)}
  .act.waiting .chip,.act.done .chip,.act.gone .chip,.act.stale .chip,.act.superseded .chip{color:var(--text-3)}
  .plan>.act.nest>summary{padding-left:24px}
  .detail{padding:0 10px 14px 10px;display:grid;gap:8px}
  .case{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 14px;font-size:13px;line-height:1.35}
  .case .k,.evidence .k,.offer .k{font:600 11px/1.6 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}
  .case .k{padding-top:3px}
  .fact{display:inline-block;background:var(--surface-2);border-radius:3px;padding:2px 8px;margin:0 6px 4px 0;font-size:13px;color:var(--text)}
  .act.waiting .fact{color:var(--text-2)}
  .fact[data-net="fixes_only"]::before{content:'✓ ';color:var(--ok)}
  .fact[data-net="mixed"]{color:var(--accent)}
  .fact[data-net="costs_only"]{color:color-mix(in srgb,var(--danger) 80%,var(--text))}
  .evidence{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;font-size:13px;line-height:1.4}
  .evidence .note{color:var(--text-2);min-width:0}
  .evidence a{color:var(--text);text-decoration:underline;text-decoration-color:var(--line);font:12px var(--mono)}
  .evidence .asof{font:12px var(--mono);color:var(--text-3)}
  .offer .ohead{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .offer pre{max-height:9.5em;overflow:auto;font:13px/1.5 var(--mono);color:var(--text);background:var(--surface-2);border-left:2px solid var(--line);border-radius:0 3px 3px 0;padding:8px 12px;margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
  button.copy,.act .dismiss{font:600 12px var(--body);letter-spacing:.06em;text-transform:uppercase;background:none;border:1px solid var(--line);border-radius:3px;color:var(--text-2);padding:0 12px;min-height:32px;cursor:pointer}
  button.copy:hover,.act .dismiss:hover{border-color:var(--accent);color:var(--text)}
  .src{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;font:12px var(--mono);color:var(--text-3)}
  .src a{color:var(--text-2);text-decoration:underline;text-decoration-color:var(--line)}
  .strip{overflow-x:auto;padding:6px 8px 8px 12px;border-top:1px solid var(--line-soft)}
  .strip table{width:100%;min-width:0;border-collapse:collapse;font:12px var(--mono)}
  .strip th{font:600 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);text-align:left;padding:2px 12px 4px 0;border:0}
  .strip td{padding:3px 12px 3px 0;border:0;white-space:normal;color:var(--text);background:none}
  .strip td:first-child{color:var(--text-3)}
  .strip td:nth-child(4),.strip td:nth-child(5){white-space:nowrap}
  .strip tr:nth-child(even){background:none}
  .none{padding:14px 0;color:var(--text-2)}
  .none b{color:var(--text);font-weight:600}
  .none .next{font:12px var(--mono)}
  .item{padding:8px 0;display:flex;gap:10px;align-items:baseline;font-size:13px;line-height:1.4}

<script>
const CFG = { league:'1353093442397294592', me:12, repo:'the-nebulizer/gridiron', ask_url:'https://claude.ai/artifact/FMKnrqruo8QqrpG7qednqY' };
// day/hour: when each routine fires (UTC), so the page can tell when one ran but left nothing.
// The activity note is written by hand, not by a routine, so it has no schedule and no "Run fresh".
const ROUTINES = {
  activity: {label:'Activity',  id:null, day:null, hour:null, auto:''},
  waivers:  {label:'Waivers',   id:'trig_018jkMrmz2vDLU6qQdiGeKZE', day:2, hour:12, auto:'runs Tuesdays, ahead of Wednesday claims'},
  lineup:   {label:'Lineup',    id:'trig_01DxqQ5pTd1sJRc8CSnX4YHy', day:4, hour:12, auto:'runs Thursdays'},
  inactives:{label:'Inactives', id:'trig_01WEymfugQorRLQeP2YLdvqx', day:0, hour:16, auto:'runs Sunday mornings'},  // 40 16 UTC: after inactives post, before kickoff, in CDT and CST alike
  trades:   {label:'Trades',    id:'trig_01Jr9ik2fKEiwcs4yaS99ZeQ', day:1, hour:12, auto:'runs Mondays'},
};
const WATCHER = {label:'Roster watcher', id:'trig_01DTuqiqG69gfwSjFfW65vah',
  auto:'checks hourly, and rewrites the brief after any move you make'};
const API = 'https://api.sleeper.app';
const MIN = 60*1000, HOUR = 60*MIN, DAY = 24*HOUR;
const $ = (id)=>document.getElementById(id);
const esc = (s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function j(url){ const r = await fetch(url); if(!r.ok) throw new Error(r.status+' '+url); return r.json(); }

/* ——— caching: the big feeds barely change, so don't pull them every two minutes ——— */
const mem = {};
const store = {
  get(k){ try{ const s = localStorage.getItem('gt:'+k); return s ? JSON.parse(s) : null; }catch{ return null; } },
  set(k,v){ try{ localStorage.setItem('gt:'+k, JSON.stringify(v)); }catch{} },
};
// Serve from memory (or localStorage when persist is set) while fresh; on a failed refetch, fall back to the stale copy.
async function cached(key, ttlMs, fetcher, {persist=false}={}){
  const now = Date.now();
  const hit = mem[key] || (persist ? store.get(key) : null);
  if(hit && hit.v && now - hit.t < ttlMs){ mem[key] = hit; return hit.v; }
  try{
    const v = await fetcher();
    const rec = {t:now, v};
    mem[key] = rec;
    if(persist) store.set(key, rec);
    return v;
  }catch(e){
    if(hit && hit.v){ mem[key] = hit; return hit.v; }
    throw e;
  }
}
// The full player file is 12,000 players × 50 fields; we need four fields, and mostly for a few hundred of them.
function trimPlayers(raw){
  const out = {};
  for(const id in raw){
    const p = raw[id] || {}, o = {};
    const n = p.full_name || ((p.first_name||'')+' '+(p.last_name||'')).trim();
    if(n) o.n = n;
    if(p.position) o.p = p.position;
    if(p.team) o.t = p.team;
    if(p.injury_status) o.i = p.injury_status;
    out[id] = o;
  }
  return out;
}

/* ——— shaping the raw feeds ——— */
function resolve(players, id){
  if(!id || id==='0') return null;
  const p = players[id];
  if(!p) return {id, name:/^[A-Z]{2,3}$/.test(id)?id+' DEF':'#'+id, pos:/^[A-Z]{2,3}$/.test(id)?'DEF':'?', team:id, inj:null};
  return { id, name:p.n || id, pos:p.p||'?', team:p.t||'—', inj:p.i||null };
}
// A team's bye is the one week it has no game on the schedule.
function byeWeeks(schedule){
  const weeks = [...new Set(schedule.map(g=>g.week))].sort((a,b)=>a-b);
  const played = {};
  schedule.forEach(g=>[g.home,g.away].forEach(t=>{ (played[t] = played[t]||new Set()).add(g.week); }));
  const byes = {};
  Object.entries(played).forEach(([t,ws])=>{ const b = weeks.filter(w=>!ws.has(w)); if(b.length===1) byes[t]=b[0]; });
  return byes;
}
// team -> this week's game: who, when, on what channel, and whether it's under way.
function gamesByTeam(scores){
  const out = {};
  for(const g of scores){
    const m = g.metadata || {};
    if(!m.home_team || !m.away_team) continue;
    const common = {kick:m.date_time?new Date(m.date_time):null, tv:m.channel||'', live:!!m.is_in_progress,
                    over:!!m.is_over, started:!!m.has_started, quarter:m.quarter||''};
    out[m.home_team] = {...common, opp:m.away_team, home:true};
    out[m.away_team] = {...common, opp:m.home_team, home:false};
  }
  return out;
}
const dayTime = (d)=> d ? d.toLocaleString(undefined,{weekday:'short',hour:'numeric',minute:'2-digit'}) : '';
// games is null when the scores feed didn't load; byes is null when the schedule didn't.
function gameLabel(games, byes, team, week){
  const onBye = !!byes && byes[team]===week;
  if(!games) return onBye ? 'on bye' : '';
  const g = games[team];
  if(!g) return onBye ? 'on bye' : 'no game listed';
  const side = (g.home?'vs ':'@ ')+g.opp;
  if(g.over) return side+' · final';
  if(g.live) return side+' · live'+(g.quarter?' '+g.quarter:'');
  return side+' · '+dayTime(g.kick)+(g.tv?' · '+g.tv:'');
}

// Which positions each starting slot accepts, and a maximum matching of players onto
// slots — the same model scripts/outlook.mjs uses, so the page and the reports can never
// disagree about whether a week is coverable. Counting by position is not an answer when
// FLEX and SUPER_FLEX exist: four QBs cover a QB bye, and two spare WRs do not cover a
// kicker's.
const SLOT_TAKES = {QB:['QB'], RB:['RB'], WR:['WR'], TE:['TE'], K:['K'], DEF:['DEF'],
  FLEX:['RB','WR','TE'], WRRB_FLEX:['RB','WR'], REC_FLEX:['WR','TE'], SUPER_FLEX:['QB','RB','WR','TE']};
function emptySlots(slotNames, pool){
  // Most restrictive slot first, so an unfillable week names the slot nobody can play
  // rather than whichever flex spot happened to be left over.
  const order = slotNames.map((name,idx)=>({name,idx}))
    .filter(x=>SLOT_TAKES[x.name])
    .sort((a,b)=>SLOT_TAKES[a.name].length - SLOT_TAKES[b.name].length);
  const filled = {}, slotOf = {};
  const augment = (idx, seen)=>{
    for(const p of pool){
      if(seen.has(p.id) || !SLOT_TAKES[slotNames[idx]].includes(p.pos)) continue;
      seen.add(p.id);
      const held = slotOf[p.id];
      if(held === undefined || augment(held, seen)){ slotOf[p.id] = idx; filled[idx] = p; return true; }
    }
    return false;
  };
  for(const {idx} of order) augment(idx, new Set());
  return order.filter(({idx})=>!filled[idx]).map(({name})=>name);
}

/* ——— what needs Ben ——— */
function actionItems({me, players, games, byes, week, txns, rostered, trendAdd, trendDrop, slots}){
  const items = [];
  const starters = (me.starters||[]).map(id=>resolve(players,id)).filter(Boolean);

  // Two structural faults nothing else here catches, because they're about the slot, not the player:
  // an empty starting slot scores zero all week, and a healthy body parked on IR makes Sleeper
  // refuse to save the lineup at all.
  (slots||[]).forEach((slot,i)=>{
    const id = (me.starters||[])[i];
    if(id && id!=='0') return;
    items.push({urgency:'now',
      what:`Your ${slot.replace('SUPER_FLEX','SUPERFLEX')} slot is empty`,
      why:'Nobody is in it, so it scores nothing — fill it before kickoff.'});
  });
  for(const p of (me.reserve||[]).map(id=>resolve(players,id)).filter(Boolean)){
    if(p.inj) continue;
    items.push({urgency:'soon', id:p.id,
      what:`${p.name} (${p.pos}) is on IR with no injury designation`,
      why:'Sleeper blocks lineup changes until he is moved back to the bench.'});
  }

  // A player on IR or PUP can't fill an active roster spot, so he isn't an option.
  const stashed = (p)=> /ir|pup|^na$|sus/i.test(p.inj||'');
  const seen = new Set();

  // Free-agent items need the trending feeds; without them there's no way to size demand.
  if(trendAdd && trendDrop){
    const net = (id)=> (trendAdd[id]||0) - (trendDrop[id]||0);

    // Players other managers let go who nobody has claimed.
    for(const t of (txns||[])){
      for(const id of Object.keys(t.drops||{})){
        if(rostered.has(id) || seen.has(id)) continue;
        seen.add(id);
        const p = resolve(players,id); if(!p || stashed(p)) continue;
        if(net(id) <= 0) continue;                 // the market agrees with the drop; skip
        items.push({urgency:'soon', id,
          what:`${p.name} (${p.pos} ${p.team}) is still unclaimed`,
          why:`Dropped in your league and nobody took him. ${net(id).toLocaleString()} more managers adding than dropping him across Sleeper.`});
      }
    }

    // The best players nobody here has, whether or not they were ever dropped —
    // the strongest demand across Sleeper, filtered to what's actually available.
    Object.keys(trendAdd)
      .filter(id=>!rostered.has(id) && !seen.has(id) && net(id) > 0)
      .map(id=>({id, p:resolve(players,id)}))
      .filter(x=>x.p && !stashed(x.p))
      .sort((a,b)=>net(b.id)-net(a.id))
      .slice(0,2)
      .forEach(({id,p})=>{
        seen.add(id);
        items.push({urgency:'soon', id,
          what:`${p.name} (${p.pos} ${p.team}) is free and in demand`,
          why:`Nobody in your league has him. ${net(id).toLocaleString()} more managers adding than dropping him across Sleeper — the biggest number on the board that's still available.`});
      });
  }

  // Starters carrying an injury tag, with the kickoff you have to decide by.
  for(const p of starters){
    if(!p.inj) continue;
    const g = games ? games[p.team] : null;
    const out = /out|ir|pup|doubtful/i.test(p.inj);
    // keep: an injured man in the lineup is the one alert no routine instruction may hide.
    items.push({urgency: out?'now':'soon', id:p.id, keep:true,
      what:`${p.name} is ${p.inj.toLowerCase()}`,
      why: g && !g.started && g.kick ? `Starting at ${p.pos}. Decide before ${dayTime(g.kick)}.` : `Starting at ${p.pos}.`});
  }

  // A benched player who is out for the season is the one status change nothing
  // else here would catch: he isn't starting, so the starter checks skip him, and
  // he quietly occupies a roster spot.
  const startSet = new Set(me.starters||[]);
  const benched = (me.players||[]).filter(id=>!startSet.has(id) && !(me.reserve||[]).includes(id))
    .map(id=>resolve(players,id)).filter(Boolean);
  for(const p of benched){
    if(!/ir|out|pup|^na$|sus/i.test(p.inj||'')) continue;
    const irFree = !(me.reserve||[]).length;
    items.push({urgency:'soon', id:p.id,
      what:`${p.name} (${p.pos}) is ${p.inj.toLowerCase()} on your bench`,
      why: irFree
        ? `He can't be started. Your IR slot is free — move him there and you get the bench spot back.`
        : `He can't be started and your IR slot is taken, so he's a roster spot doing nothing.`});
  }

  // Bye trouble in the next three weeks, while there's still time to plan for it.
  // Whether a week is actually coverable is solved against the real slots, not guessed
  // from the position on bye: this used to call any QB/TE/K/DEF bye uncoverable (false
  // with four quarterbacks) and any RB/WR bye covered (false with no spare bodies).
  if(byes){
    const active = (me.players||[]).filter(id=>!(me.reserve||[]).includes(id))
      .map(id=>resolve(players,id)).filter(Boolean);
    for(let w=week+1; w<=week+3; w++){
      const outThisWeek = active.filter(p=>byes[p.team]===w);
      if(!outThisWeek.length) continue;
      const gaps = emptySlots(slots||[], active.filter(p=>byes[p.team]!==w));
      const named = outThisWeek.filter(p=>(me.starters||[]).includes(p.id));
      items.push({covered: !gaps.length, urgency: gaps.length ? (w===week+1?'now':'soon') : (w===week+1?'soon':'watch'),
        what:`Week ${w}: ${(named.length?named:outThisWeek).map(p=>p.name).join(', ')} on bye`,
        why: gaps.length
          ? `No one on your roster can fill ${gaps.map(g=>g.replace('SUPER_FLEX','SUPERFLEX')).join(' or ')} that week — plan a claim.`
          : 'Covered from the bench.'});
    }
  }

  const rank = {now:0, soon:1, watch:2};
  return items.sort((a,b)=>rank[a.urgency]-rank[b.urgency]);
}

/* ——— do-now: pure logic. Covered by `npm test`, which lifts these functions out of this
   file and holds them to scripts/actions.mjs and scripts/outlook.mjs: two copies of one
   rule drift, and the card and the compiler must never disagree about what "done" means. ——— */
const URGENCY = ['now','before_kickoff','by_tuesday','this_week','optional'];
const DEADLINE = {now:'now', before_kickoff:'before kickoff', by_tuesday:'by Tue night',
                  this_week:'this week', optional:'optional'};
const urgRank = (u)=>{ const i = URGENCY.indexOf(u); return i<0 ? URGENCY.length : i; };
// Keyed by the report that proposed the trade, not by compiled_at: the watcher recompiles after
// any move, so a compiled_at key made Dismiss a one-hour snooze. A dismissal now lasts until a
// NEWER report of that type supersedes it — a new filename is a new key, so the offer comes back.
const dismissKey = (a)=> `${a.id||''}|${a.report||''}`;
const titleCase = (s)=> String(s||'').charAt(0).toUpperCase()+String(s||'').slice(1);
const prettySlot = (s)=> String(s||'').replace('SUPER_FLEX','SUPERFLEX');
// What the week is about today, by local weekday: Tue–Wed is waiver claims (they process
// Wednesday), Mon is the trade hunt, and Thu through Sun is the lineup.
const weekFocus = (day)=> day===2 || day===3 ? 'waivers' : day===1 ? 'trades' : 'lineup';
// ...and the same focus as a sort key, so the card leads with whatever today is about. An open
// start still leads on Monday: the only one left then is for a Monday-night game.
// A kind the compiler shouldn't emit sorts last, never first.
const KIND_RANK = {
  lineup:  {start:0, add:1, drop:1, ir:1, activate:1, trade:2},
  waivers: {add:0, drop:0, ir:0, activate:0, start:1, trade:2},
  trades:  {start:0, trade:1, add:2, drop:2, ir:2, activate:2},
};
const kindRank = (k, focus)=>{ const r = KIND_RANK[focus] || KIND_RANK.lineup; return r[k]==null ? 3 : r[k]; };

/* Dependency resolution. Items arrive carrying the base state actionState gave them; `after` and
   `if_not` name another action in the same compiled file. Pure, and re-runnable: the base state
   is kept on the item, so dismissing a trade can re-resolve the whole set on the spot. */
const BLOCKING = {open:1, waiting:1};
function resolveDependencies(items){
  const list = (Array.isArray(items) ? items : []).filter(i=>i && typeof i==='object');
  const idx = new Map();
  list.forEach((i,n)=>{ const k = i.id==null ? '' : String(i.id); if(k && !idx.has(k)) idx.set(k,n); });
  // A parent that isn't in the file is no parent at all: the child stands as a primary rather
  // than waiting forever on something the card can never show.
  const edgeTo = (i,n,field)=>{
    const raw = i[field]; if(raw==null || raw==='') return null;
    const p = idx.get(String(raw));
    return (p==null || p===n) ? null : p;
  };
  const edges = list.map((i,n)=>({after:edgeTo(i,n,'after'), if_not:edgeTo(i,n,'if_not')}));
  // Break the link that closes a loop, so a cycle can hang neither the resolver nor the renderer.
  const seen = new Array(list.length).fill(0);
  const walk = (n)=>{
    seen[n] = 1;
    for(const f of ['after','if_not']){
      const p = edges[n][f];
      if(p==null) continue;
      if(seen[p]===1) edges[n][f] = null;        // back edge
      else if(seen[p]===0) walk(p);
    }
    seen[n] = 2;
  };
  list.forEach((_,n)=>{ if(seen[n]===0) walk(n); });

  // When an action has both links, the more restrictive outcome wins.
  const RANK = {waiting:3, gone:2, superseded:1};
  const memo = new Array(list.length);
  const res = (n)=>{
    if(memo[n]) return memo[n];
    const i = list[n];
    const base = i.base_state || i.state || 'open';
    let state = base, parent = null, link = null, rank = 0;
    for(const f of ['after','if_not']){
      const p = edges[n][f];
      if(p==null) continue;
      const par = res(p), ps = par.state;
      // An if_not child of a parent that was itself shelved as superseded covered a need the
      // grandparent already met (A done -> B superseded -> C superseded), so it is not promoted.
      // An `after` child of a superseded parent can never run, and stays gone.
      const s = BLOCKING[ps] ? (base==='open' ? 'waiting' : base)
              : (ps==='done' || (ps==='superseded' && f==='if_not')) ? (f==='after' ? base : 'superseded')
              : (f==='after' ? 'gone' : base);   // gone · dismissed · stale · superseded
      const r = RANK[s] || 0;
      if(r > rank){ rank = r; state = s; parent = par; link = f; }
    }
    // Only a waiting dependent is drawn under its parent; promoted, gone and superseded ones
    // stand (or are shelved) on their own.
    const nested = state==='waiting' && !!parent;
    // Why an `after` child is gone when it was the parent's fate, not its own: the card says so
    // instead of claiming a player who was never on the roster has left it.
    const goneVia = (state==='gone' && link==='after' && base!=='gone' && parent) ? parent.state : null;
    const out = {...i, base_state:base, state, gone_via:goneVia,
      parent_id: nested ? (parent.id==null ? null : String(parent.id)) : null,
      link: nested ? link : null,
      depth: nested ? (parent.depth||0) + 1 : 0};
    memo[n] = out;
    return out;
  };
  return list.map((_,n)=>res(n));
}

/* live = {week, players:Set(my ids), starters:[], reserve:[], ownerOf(id)->name|null,
           games:{team->gamesByTeam entry}|null, teamOf(id)->team|null, dismissed:Set(keys)} */

// A team's kickoff locks every one of its players' starting slots — Sleeper refuses a start/for
// swap once the game is under way, same rule scripts/actions.mjs' kickedOffGame enforces at
// compile time. live.games is null whenever the scores feed hasn't loaded; treated as unknown,
// never as kicked off, so a network hiccup can't strand every open start as stale.
function teamKickedOff(live, team){
  if(!live.games || !team) return false;
  const g = live.games[team];
  return !!(g && (g.started || g.live || g.over));
}
function actionState(a, live){
  // Ids come out of JSON, so one arriving as a number would silently miss a Set of strings —
  // and a missed `drop` reads as "done", i.e. the card claiming a move Ben never made.
  const S = (x)=> x==null ? '' : String(x);
  const starters = (live.starters||[]).map(S), reserve = (live.reserve||[]).map(S);
  // Sleeper puts IR players in `players` too, but don't rely on it: starters and reserve count.
  const has = (id)=>{ const s = S(id);
    return !!s && (live.players.has(s) || starters.includes(s) || reserve.includes(s)); };
  const player = S(a.player);
  // Sleeper flips its week number on Tuesday, so only a start/sit instruction expires with the week.
  // An add, a drop, an IR move or a trade is still the right move on Wednesday.
  const wk = a.week==null ? live.week : a.week;
  if(a.kind==='start' && wk < live.week) return {state:'stale'};
  const dismissed = live.dismissed && live.dismissed.has(dismissKey(a));
  // A start/IR/activate instruction about a player who has since left the roster can't be carried
  // out at all. Shelve it as gone rather than leaving an impossible move in the open list.
  const lost = ()=> ({state:'gone', owner: (live.ownerOf && live.ownerOf(player)) || null});
  switch(a.kind){
    case 'add': {
      if(has(player)) return {state:'done'};
      const o = live.ownerOf ? live.ownerOf(player) : null;
      if(o) return {state:'gone', owner:o};
      return {state:'open'};
    }
    case 'drop':     return {state: has(player) ? 'open' : 'done'};
    case 'start': {
      if(starters.includes(player) && (!a.for || !starters.includes(S(a.for)))) return {state:'done'};
      if(!has(player)) return lost();
      // The benched `for` player's team is never on the compiled action (only his name/id are —
      // see scripts/actions.mjs finalizeAction), so it's resolved fresh from the player file, the
      // same source `ownerOf` and `resolve()` already draw from.
      const forTeam = a.for && live.teamOf ? live.teamOf(a.for) : null;
      if(teamKickedOff(live, a.team) || teamKickedOff(live, forTeam)) return {state:'stale'};
      return {state:'open'};
    }
    case 'ir':       return reserve.includes(player) ? {state:'done'}
                       : has(player) ? {state:'open'} : lost();
    case 'activate': return has(player) && !reserve.includes(player) ? {state:'done'}
                       : has(player) ? {state:'open'} : lost();
    case 'trade': {
      const get = Array.isArray(a.get) ? a.get : [];
      const give = Array.isArray(a.give) ? a.give : [];
      if(get.length && get.every(has)) return {state:'done'};
      // An offer you can no longer honour is not an instruction. The compiler already
      // shelves these; the card used to keep showing them as open, telling Ben to send
      // an offer built on a player he had dropped or traded away.
      if(give.length && !give.every(has)) return {state:'gone'};
      // Same the other way: the other manager may have moved the player it asks for.
      if(get.length && live.ownerOf && a.with_owner &&
         !get.every(id=> has(id) || live.ownerOf(S(id))===a.with_owner)) return {state:'gone'};
      return {state: dismissed ? 'dismissed' : 'open'};
    }
  }
  return {state:'open'};
}

function actionHeadline(i){
  const nm = (n,pos,team)=> `${esc(n||'?')}${pos?` <span class="meta">(${esc(pos)} · ${esc(team||'—')})</span>`:''}`;
  const list = (v)=> (Array.isArray(v)?v:[]).map(esc).join(', ');
  // Gone is a statement of fact, never an instruction: say who has him, or that he's off the roster.
  if(i.state==='gone' && i.kind!=='trade'){
    const via = i.gone_via ? ({dismissed:'was dismissed', stale:'went stale', superseded:'is no longer needed'}[i.gone_via] || 'is no longer possible') : '';
    return `${nm(i.name,i.pos,i.team)} — ${i.owner ? `taken by ${esc(i.owner)}` : via ? `the move it followed ${via}` : 'no longer on your roster'}`;
  }
  switch(i.kind){
    case 'add': {
      const bid = (i.mode==='waiver' && i.faab!=null) ? `, bid $${esc(i.faab)}` : '';
      return `Add ${nm(i.name,i.pos,i.team)}${i.drop_name?`, drop ${esc(i.drop_name)}`:''}${bid}`;
    }
    case 'drop':     return `Drop ${nm(i.name,i.pos,i.team)}`;
    case 'start':    return `Start ${nm(i.name,i.pos,i.team)} at ${esc(prettySlot(i.slot))}${i.for_name?`, bench ${esc(i.for_name)}`:''}`;
    case 'ir':       return `Move ${nm(i.name,i.pos,i.team)} to IR`;
    case 'activate': return `Activate ${nm(i.name,i.pos,i.team)} from IR`;
    case 'trade':    return `Offer ${list(i.give_names)||'—'} to ${esc(i.with_owner||('roster '+i.with))} for ${list(i.get_names)||'—'}`;
  }
  // A kind the compiler shouldn't emit: still name the player rather than printing a bare verb.
  return `${esc(titleCase(i.kind||'—'))} ${nm(i.name,i.pos,i.team)}`.trim();
}

// One kind tag per row, so a bare order number is never read as a priority ranking.
// `add` reads as `claim` unless it's the pre-season first-come-first-serve mode, where it's `add`.
const KIND_TAG = {add:'claim', drop:'drop', start:'lineup', ir:'ir', activate:'ir', trade:'trade'};
const kindTag = (i)=> i.kind==='add' && i.mode==='fcfs' ? 'add' : (KIND_TAG[i.kind] || '');

// The case: up to five short facts, always in this order, always under these plain-English
// labels. Shelved items (done/gone/superseded) don't draw it — it argued for a move that is over.
// 'asks' is the trade-only line: what the deal asks of the other manager, computed from their
// own roster rather than asserted by the report (see docs/ACTIONS.md "The case"). Each line is
// split on " · " into chips; the last line carries the tradeoff's net so it can be coloured.
const CASE_LINES = [['starts','Where he fits'], ['need','The need'], ['cost','The cost'], ['asks','What they give up'], ['later','Rest of season']];
function caseGrid(i){
  if(i.state!=='open' && i.state!=='waiting') return '';
  const c = i.case;
  if(!c || typeof c!=='object' || Array.isArray(c)) return '';
  const net = c.tradeoff && typeof c.tradeoff.net==='string' ? c.tradeoff.net : '';
  const chips = (k)=> String(c[k]).split(' · ').map(s=>s.trim()).filter(Boolean)
    .map(s=> `<span class="fact"${k==='later' && net ? ` data-net="${esc(net)}"` : ''}>${esc(s)}</span>`).join('');
  const lines = CASE_LINES.filter(([k])=> typeof c[k]==='string' && c[k]!=='')
    .map(([k,label])=> `<span class="k">${esc(label)}</span><span class="v">${chips(k)}</span>`).join('');
  return lines ? `<div class="case">${lines}</div>` : '';
}

// The word that says why a fallback is on the card at all: what happens first.
function leadWord(i, parent, orphan){
  if(orphan) return 'depends on a move no longer listed';
  if(i.link==='after') return 'then';
  const pk = parent && parent.kind;
  return pk==='trade' ? 'if declined' : pk==='add' ? 'if that misses' : 'if that falls through';
}
const hostOf = (u)=> (String(u).match(/^https?:\/\/(?:www\.)?([^\/?#]+)/i)||[])[1] || String(u);

// A disclosure row used all over the page: the closed state names its own answer.
function fold(key, title, summary, body, open, cls){
  return `<details class="${cls ? esc(cls)+' ' : ''}fold" data-key="${esc(key)}"${open?' open':''}><summary>
      <span class="ttl">${esc(title)}</span><span class="sum">${summary}</span><span class="caret" aria-hidden="true"></span>
    </summary><div class="body">${body}</div></details>`;
}

/* o = {num} for a numbered primary, or {depth, parent} for a dependent drawn under it. */
function actionRow(i, m, o){
  o = o || {};
  const nested = !!o.parent;
  const depth = Math.max(0, Math.min(3, Math.round(Number(o.depth)||0)));
  // A numbered primary carries its place in the standing order; a dependent carries a muted hook.
  const glyph = i.state==='done' ? '✓' : i.state==='gone' ? '✕' : i.state==='superseded' ? '⊘'
    : i.state==='stale' ? '⏱' : o.num ? String(o.num) : nested ? '↳' : '●';
  // A stale start's deadline_label/urgency argued for a move that's no longer on offer — a
  // one-word "stale" chip replaces it rather than showing a kickoff window that's already past.
  const chip = i.state==='stale' ? 'stale' : (i.deadline_label || DEADLINE[i.urgency] || 'when you can');
  const date = (String(i.report||'').match(/^\d{4}-\d{2}-\d{2}/)||[String(i.report||'').replace(/\.md$/,'')])[0];
  const kind = kindTag(i);
  const live = i.state==='open' || i.state==='waiting';
  // Drop the parts that aren't there rather than printing " · · ". A shelved row was not checked
  // just now, so it carries who wrote it and when, and no "checked" time.
  const src = [titleCase(i.source), date, live && m.now ? `checked ${m.now}` : ''].filter(Boolean).map(esc).join(' · ');
  // A move the compiler has already worked out costs more than it fixes must not be drawn like
  // one that helps. On 2026-09-22 the top row of this card opened a Week 11 tight-end hole and
  // closed nothing — both facts were sitting in the case grid below it, in the same weight and
  // colour as everything else, and the move read as the week's recommendation anyway.
  const net = i.case && i.case.tradeoff && i.case.tradeoff.net;
  const flag = (live && net==='costs_only') ? '<span class="flag">costs more than it fixes</span>' : '';
  const lead = nested ? `<span class="lead">${esc(leadWord(i, o.parent, o.orphan))}</span>` : '';
  const head = `<span class="glyph" aria-hidden="true">${esc(glyph)}</span>`;
  const move = `<span class="move">${lead}${kind ? `<span class="kind">${esc(kind)}</span>` : ''}${actionHeadline(i)}${flag}</span>`;

  if(!live){
    // Shelved: an outcome, not an argument. A stale action's own `why` argued for the move while
    // it was still open; once kickoff has taken it off the table state_reason (when the compiler
    // could name one) replaces it, and no reason (a plain week rollover) means the chip is the story.
    const whyLine = i.state==='stale'
      ? (i.state_reason ? `<div class="why">${esc(i.state_reason)}</div>` : '')
      : (i.why ? `<div class="why">${esc(i.why)}</div>` : '');
    return `<div class="act ${esc(i.state)}">${head}${move}<div class="chip">${esc(chip)}</div>${whyLine}${src ? `<div class="src"><span>${src}</span></div>` : ''}</div>`;
  }

  const dism = (i.kind==='trade' && i.state==='open')
    ? `<button class="dismiss" data-dismiss="${esc(dismissKey(i))}">Dismiss</button>` : '';
  const write = (m.repo && i.report)
    ? `<a href="https://github.com/${esc(m.repo)}/blob/main/reports/${esc(i.report)}" target="_blank" rel="noopener">Read the write-up ↗</a>` : '';
  // The message the routine wrote for Ben to paste into Sleeper, only while the trade is still his to send.
  const offer = (i.kind==='trade' && i.state==='open' && typeof i.message==='string' && i.message.trim())
    ? `<div class="offer"><div class="ohead"><span class="k">Message to send</span><button class="copy" data-copy>Copy</button></div><pre>${esc(i.message)}</pre></div>` : '';
  // The claim the move rests on, and where it came from — the one class of assertion the
  // compiler cannot check (a player's role, health, return date). Shown only while the action is
  // live, and only as a link when the url really is one: this file is re-read from the repo at
  // runtime, so a "javascript:" url is treated as no url at all rather than trusted.
  const ev = i.evidence;
  const evUrl = (ev && typeof ev.url==='string' && /^https?:\/\//i.test(ev.url)) ? ev.url : '';
  const evidence = (ev && typeof ev.note==='string' && ev.note)
    ? `<div class="evidence"><span class="k">Because</span><span class="note">${esc(ev.note)}</span>${evUrl
        ? `<a href="${esc(evUrl)}" target="_blank" rel="noopener noreferrer">${esc(hostOf(evUrl))} ↗</a>` : ''}${
        ev.as_of ? `<span class="asof">${esc(ev.as_of)}</span>` : ''}</div>`
    : '';
  const key = 'act:' + (i.id!=null && i.id!=='' ? i.id : `${i.kind}:${i.player||''}`);
  return `<details class="act ${esc(i.state)}${depth ? ` nest nest-${depth}` : ''}" data-key="${esc(key)}">
      <summary>${head}${move}<div class="chip">${esc(chip)}</div>${i.why ? `<span class="why">${esc(i.why)}</span>` : ''}</summary>
      <div class="detail">${caseGrid(i)}${evidence}${offer}<div class="src"><span>${src}</span>${write}${dism}</div></div>
    </details>`;
}

// The options side by side: what each path gets, gives, costs and by when. A string builder only.
function compareStrip(primary, rungs){
  const inj = (i)=>{ const a = String((i.case && i.case.asks) || '');
    return /Questionable/.test(a) ? ' Q' : /Doubtful/.test(a) ? ' D' : /\bOut\b/.test(a) ? ' O' : ''; };
  const names = (v)=> (Array.isArray(v) ? v : []).filter(Boolean).join(', ');
  // What each kind of move brings in and sends out. Only a trade or a claim names both sides;
  // a start benches someone, a drop and an IR move only send a player away, an activation only
  // brings one back — printing the mover in both columns would say he is swapped for himself.
  const NONE = '—';
  const sides = (i)=>{
    const nm = i.name || NONE;
    switch(i.kind){
      case 'trade':    return [names(i.get_names) || NONE, names(i.give_names) || NONE];
      case 'start':    return [nm, i.for_name || NONE];
      case 'drop':     return [NONE, nm];
      case 'ir':       return [NONE, nm + ' (to IR)'];
      case 'activate': return [nm + ' (from IR)', NONE];
      default:         return [names(i.get_names) || nm, names(i.give_names) || i.drop_name || NONE];   // add / claim
    }
  };
  const get = (i)=>{ const g = sides(i)[0]; return g===NONE ? g : g + inj(i); };
  const give = (i)=> sides(i)[1];
  const cost = (i)=>{
    if(i.faab==null) return 'no FAAB';
    const of = String((i.case && i.case.cost) || '').match(/^\$\d+ of (\$\d+)/);
    return '$'+i.faab + (of ? ' of '+of[1] : '');
  };
  const by = (i)=> i.deadline_label || DEADLINE[i.urgency] || 'when you can';
  const row = (lab, i)=> `<tr><td>${esc(lab)}</td><td>${esc(get(i))}</td><td>${esc(give(i))}</td><td>${esc(cost(i))}</td><td>${esc(by(i))}</td></tr>`;
  return `<div class="strip"><table><thead><tr><th>Options</th><th>Get</th><th>Give</th><th>Cost</th><th>By</th></tr></thead><tbody>${
    row('now', primary)}${rungs.map(r=>row(leadWord(r.item, r.parent), r.item)).join('')}</tbody></table></div>`;
}

/* m = {ok, week, now, league, repo?, items:[action+state, resolved by resolveDependencies],
        alerts:[actionItems() output], nextCheck, drift}. Sets m.primary and m.openCount as it goes,
   so the rail and the tab badge can be drawn without sorting again. */
function renderDoNow(m){
  // `stale` used to be dropped here entirely — a start whose kickoff (or week) passed it by
  // vanished with no trace, even though the compiler names why. It's shelved alongside
  // done/gone/superseded instead, below, so the fact it happened is visible.
  const items = (m.items||[]).filter(i=>i.state!=='dismissed');
  // Primaries are everything open that isn't hanging off another action, numbered in the
  // order today's focus puts them in (weekFocus); urgency, then report date, within each.
  const open = items.filter(i=>i.state==='open' && !i.parent_id)
    .sort((a,b)=> kindRank(a.kind, m.focus)-kindRank(b.kind, m.focus)
               || urgRank(a.urgency)-urgRank(b.urgency)
               || String(b.report||'').localeCompare(String(a.report||'')));
  const shelved = items.filter(i=>i.state==='done' || i.state==='gone' || i.state==='superseded' || i.state==='stale');
  const alerts = m.alerts||[];
  m.primary = open[0] || null;
  m.openCount = open.length;

  // Waiting dependents hang under their parent. They are not instructions yet, so they are
  // drawn muted and are counted as fallbacks, not as "open".
  const kidsOf = new Map();
  items.filter(i=>i.state==='waiting' && i.parent_id!=null && i.parent_id!=='').forEach(i=>{
    const k = String(i.parent_id);
    if(!kidsOf.has(k)) kidsOf.set(k, []);
    kidsOf.get(k).push(i);
  });
  const drawn = new Set();
  const branch = (parent, depth, rungs)=>{
    const kids = (kidsOf.get(parent.id==null ? '' : String(parent.id))||[])
      .filter(k=>!drawn.has(k))
      .sort((a,b)=> (a.link==='after'?0:1)-(b.link==='after'?0:1) || urgRank(a.urgency)-urgRank(b.urgency));
    return kids.map(k=>{ drawn.add(k); rungs.push({item:k, parent}); return actionRow(k, m, {depth, parent}) + branch(k, depth+1, rungs); }).join('');
  };
  let rows = open.map((i,n)=>{
    drawn.add(i);
    const rungs = [];
    const kids = branch(i, 1, rungs);
    // The strip compares alternatives. A "then" step runs as well as its parent, not instead of it.
    const options = rungs.filter(r=>r.item.link==='if_not');
    return `<div class="plan">${actionRow(i, m, {num:n+1})}${kids}${options.length ? compareStrip(i, options) : ''}</div>`;
  }).join('');
  // A dependent whose parent isn't on the card at all (a malformed file) is still shown, flat,
  // rather than silently dropped.
  const orphans = items.filter(i=>i.state==='waiting' && !drawn.has(i));
  if(orphans.length) rows += `<div class="plan">${orphans.map(i=>{ drawn.add(i); return actionRow(i, m, {depth:1, parent:{}, orphan:true}); }).join('')}</div>`;

  let body = rows
    || `<div class="none">${ m.ok===false
        ? 'No actions compiled yet — the next routine run writes them.'
        : `<b>Nothing to do.</b> <span class="next">Next: ${esc(m.nextCheck||'Waivers run Tue 7am')}</span>` }</div>`;

  // Heads up: what the page works out for itself from live Sleeper data. No judgment, never
  // stale. The quiet ones fold away behind a count.
  const item = (a)=> `<div class="item"><span class="tag ${esc(a.urgency)}">${esc(a.urgency)}</span>
      <span class="what"><b>${esc(a.what)}</b><span class="why">${esc(a.why)}</span></span></div>`;
  // Two slots stay open for whatever else there is, but an alert that needs Ben before kickoff is
  // never folded away behind a count: anything urgent ('now'), an injured starter (keep) and a bye
  // no one on the roster can cover always show, however many there are.
  const allLoud = alerts.filter(a=>a.urgency!=='watch');
  const pinned = (a)=> a.urgency==='now' || a.keep===true || a.covered===false;
  let room = Math.max(0, 2 - allLoud.filter(pinned).length);
  const loud = allLoud.filter(a=> pinned(a) || room-- > 0);
  const quiet = allLoud.filter(a=>!loud.includes(a)).concat(alerts.filter(a=>a.urgency==='watch'));
  if(loud.length || quiet.length){
    body += `<div class="heads">${loud.length ? `<div class="eyebrow">Heads up</div>${loud.map(item).join('')}` : ''}${
      quiet.length ? fold('heads-quiet', `${quiet.length} more note${quiet.length===1?'':'s'}`, '', quiet.map(item).join(''), false) : ''}</div>`;
  }

  // "Done", "gone", "stale" and "superseded" are four different pieces of news: a move you made,
  // one you can no longer make, a start whose window (kickoff or the week itself) closed before
  // you acted, and a fallback you no longer need.
  if(shelved.length){
    const nDone = shelved.filter(i=>i.state==='done').length;
    const nGone = shelved.filter(i=>i.state==='gone').length;
    const nStale = shelved.filter(i=>i.state==='stale').length;
    const nSup  = shelved.length - nDone - nGone - nStale;
    const label = [nDone?`Done (${nDone})`:'', nGone?`no longer possible (${nGone})`:'',
                   nStale?`stale (${nStale})`:'', nSup?`superseded (${nSup})`:''].filter(Boolean).join(' · ');
    body += fold('shelved', 'Shelved', label, shelved.map(i=>actionRow(i,m)).join(''), false, 'donedrop');
  }

  if(m.drift) body += `<div class="drift">Your roster has changed since these were written — the watcher re-runs within the hour.</div>`;

  // "Ask" opens the companion page in one named tab (clicking again re-focuses it rather than
  // opening another). It comes in on the model, not from a global, because the Ask page draws
  // this same card with this same function and must not link to itself.
  const askLink = m.askUrl ? `<a href="${esc(m.askUrl)}" target="gridiron-ask" rel="noopener">Ask ↗</a>` : '';
  const fallbacks = items.filter(i=>i.state==='waiting').length;
  return `<div class="donow" id="donow">
      <div class="phead">
        <div class="dtitle"><span class="eyebrow">Do now</span> <span class="dcount"><b>${open.length} open</b>${fallbacks ? ` · ${fallbacks} fallback${fallbacks===1?'':'s'}` : ''}</span></div>
        <div class="dlinks">${askLink}<a class="sleeper" href="https://sleeper.com/leagues/${esc(m.league)}" target="_blank" rel="noopener">Sleeper ↗</a></div>
      </div>${body}</div>`;
}
/* ——— end do-now pure ——— */

/* ——— do-now: live wiring ——— */
const DISMISS_KEY = 'gridiron.dismissed';
function dismissedSet(){
  try{ const raw = localStorage.getItem(DISMISS_KEY); return new Set(raw ? JSON.parse(raw) : []); }
  catch{ return new Set(); }
}
function rememberDismiss(key){
  try{ const s = dismissedSet(); s.add(key); localStorage.setItem(DISMISS_KEY, JSON.stringify([...s])); }catch{}
}
// actions.json is absent until the first routine run writes it, so a 404 is normal, not a failure —
// but a blip at GitHub is not the same thing as "no actions". Only a real 404 clears the card;
// anything else keeps the last good copy, so a two-minute refresh can't blank Ben's moves.
let lastActions = null;
async function fetchActions(url){
  try{
    const r = await fetch(url);
    if(r.status===404){ lastActions = null; return null; }
    if(!r.ok) return lastActions;
    return (lastActions = await r.json());
  }catch{ return lastActions; }
}
function pickNextCheck(sources){
  const all = Object.values(sources||{}).filter(s=>s && s.next_check);
  // written_at is a real timestamp, so it orders two sources compiled the same day correctly;
  // report's filename date alone can't tell a 7am waivers run from a 6pm lineup run on the same
  // date apart. Falls back to the filename compare for any source that doesn't carry one.
  const sortKey = (s)=> typeof s.written_at==='string' && s.written_at ? s.written_at : String(s.report||'');
  const freshest = (arr)=> arr.slice().sort((a,b)=>sortKey(b).localeCompare(sortKey(a)))[0];
  const pick = freshest(all.filter(s=>!s.stale)) || freshest(all);
  return pick ? pick.next_check : 'Waivers run Tue 7am';
}
function rosterDrifted(doc, myR){
  const r = doc && doc.roster;
  // No usable fingerprint is "can't tell", which is not the same as "it moved" — say nothing.
  if(!r || typeof r!=='object'
     || !(Array.isArray(r.starters) && Array.isArray(r.bench) && Array.isArray(r.reserve))) return false;
  // An empty starting slot is "0" live and null in the fingerprint; same fact, two spellings.
  const slot = (x)=> (x==null || x==='' || x==='0' || x===0) ? '—' : String(x);
  const starters = (myR.starters||[]).map(slot);
  const reserve  = (myR.reserve||[]).map(String);
  const rSet = new Set(reserve), sSet = new Set(starters);
  const bench = (myR.players||[]).map(String).filter(id=>!sSet.has(id) && !rSet.has(id)).sort();
  const same = (a,b)=> JSON.stringify(a||[]) === JSON.stringify(b||[]);
  return !(same(starters,(r.starters||[]).map(slot))
        && same(bench,(r.bench||[]).map(String).sort())
        && same(reserve.slice().sort(),(r.reserve||[]).map(String).sort()));
}
function wireDismiss(m){
  document.querySelectorAll('[data-dismiss]').forEach(b=>b.addEventListener('click', ()=>{
    const key = b.dataset.dismiss;
    rememberDismiss(key);
    // Re-resolve: a dismissed trade promotes the claim that was waiting behind it, right now.
    m.items = resolveDependencies(m.items.map(i=> dismissKey(i)===key
      ? {...i, state:'dismissed', base_state:'dismissed'} : i));
    const el = $('donow');
    if(el){
      const y = scrollY;
      el.outerHTML = renderDoNow(m); wireDismiss(m);
      restoreOpen(); paintChrome(m); scrollTo(0, y);
    }
  }));
}

/* ——— page chrome: rail, tab badge, open/closed memory, router, theme, copy ——— */
// The phone's bottom rail always shows the one move to make; the Do tab carries the open count.
function paintChrome(m){
  const b = $('badge-do');
  if(b){ b.textContent = m.openCount || ''; b.hidden = !m.openCount; }
  // The badge is just a number to a screen reader, so the link says what it counts.
  const doLink = document.querySelector('.nav a[href="#do"]');
  if(doLink){ if(m.openCount) doLink.setAttribute('aria-label', `Do, ${m.openCount} open`); else doLink.removeAttribute('aria-label'); }
  const r = $('rail');
  if(!r){ syncChrome(); return; }
  const p = m.primary;
  // The rail is the one move on a phone, so a move the compiler worked out costs more than it fixes
  // carries the same warning here that its row carries in the card.
  const net = p && p.case && p.case.tradeoff && p.case.tradeoff.net;
  const flag = net==='costs_only' ? '<span class="flag">costs more than it fixes</span>' : '';
  r.className = 'rail' + (p ? '' : ' idle');
  r.innerHTML = `<div class="rtxt"><span class="eyebrow">${p ? 'Do now' : m.ok===false ? 'No moves compiled yet' : 'Nothing to do'}${flag}</span>
      <div class="rhead">${p ? actionHeadline(p) : 'Next: '+esc(m.nextCheck||'Waivers run Tue 7am')}</div></div>
    <a class="go" href="https://sleeper.com/leagues/${esc(m.league)}" target="_blank" rel="noopener">Sleeper ↗</a>`;
  syncChrome();
}
// The header and the phone rail are sticky, so a row that takes keyboard focus (or a scrolled-to
// anchor) has to stop short of them. Their heights change with the width and the content, so
// they are measured rather than guessed; the root's scroll padding reads these two numbers.
function syncChrome(){
  const top = document.querySelector('.top'), rail = $('rail');
  const st = document.documentElement.style;
  st.setProperty('--top-h', (top ? top.offsetHeight : 48) + 'px');
  st.setProperty('--rail-h', (rail ? rail.offsetHeight : 0) + 'px');
}
addEventListener('resize', syncChrome);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(syncChrome);
if('ResizeObserver' in window){ const ro = new ResizeObserver(syncChrome); ro.observe(document.querySelector('.top')); }

// Which <details> are open survives the two-minute rebuild, and a reload. Until the reader has
// touched anything the markup's own `open` attributes are the defaults.
const OPEN_KEY = 'gridiron.open';
let openKeys = null;
function loadOpen(){
  if(openKeys) return;
  try{ const s = localStorage.getItem(OPEN_KEY); if(s) openKeys = new Set(JSON.parse(s)); }catch{}
}
function restoreOpen(){
  loadOpen();
  if(!openKeys) return;
  document.querySelectorAll('#app details[data-key]').forEach(d=>{ d.open = openKeys.has(d.dataset.key); });
}
// One row at a time, never "whatever is in the page right now": the write-up's sections arrive
// after the first paint, and a toggle fired while they were still loading used to forget them.
document.addEventListener('toggle', e=>{
  const d = e.target;
  if(!(d.matches && d.matches('#app details[data-key]'))) return;
  loadOpen();
  if(!openKeys) openKeys = new Set([...document.querySelectorAll('#app details[data-key][open]')].map(x=>x.dataset.key));
  if(d.open) openKeys.add(d.dataset.key); else openKeys.delete(d.dataset.key);
  try{ localStorage.setItem(OPEN_KEY, JSON.stringify([...openKeys])); }catch{}
}, true);

// The hash is the view: #do (default), #week, #league, #brief, #brief/<routine|settings>.
const VIEWS = ['do','week','league','brief'];
const isWide = ()=> matchMedia('(min-width:1100px)').matches;
// The nav says which view is current: a real token (an empty aria-current means "false"), on one link only.
function paintNav(view){
  document.querySelectorAll('.nav a').forEach(a=>{
    if(a.getAttribute('href')==='#'+view) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
  });
}
let navView = 'do';
function route(scrollToTop){
  const [v, sub] = location.hash.slice(1).split('/');
  const view = VIEWS.includes(v) ? v : 'do';
  document.body.dataset.view = view;
  navView = view; paintNav(view);
  if(view==='brief' && sub && ((ROUTINES[sub] && sub!=='activity') || sub==='settings') && rendered && sub!==currentBrief) showBrief(sub);
  if(scrollToTop && isWide()) document.getElementById(view)?.scrollIntoView({block:'start'});
  else if(scrollToTop) window.scrollTo(0,0);
}
addEventListener('hashchange', ()=>route(true));
// A link that arrives on a view (#league, #brief/lineup) has to land on it, but the write-up fills in a
// moment after the first paint and the page grows under the reader, so the landing is repeated once
// when it does — unless the reader has already taken hold of the scroll themselves.
let deepLink = false;
function armDeepLink(){ deepLink = true; setTimeout(()=>{ deepLink = false; }, 10000); }
function settleDeepLink(){
  if(!deepLink) return;
  deepLink = false;
  if(isWide() && location.hash.length > 1) route(true);
}
['wheel','touchstart','keydown','mousedown'].forEach(t=>addEventListener(t, ()=>{ deepLink = false; }, {passive:true, capture:true}));
// Wide screens show all four at once, in a two-by-two grid, so the nav follows the scroll instead of
// the hash. Two views share every row and scroll together, so scrolling can only tell the rows
// apart: within the row that is under the reading line the current view stays put if it is one of
// the two (a click on Brief must not light League), otherwise the row's left-hand view takes it.
// It works from where things are right now, on a scroll and after every refresh, so a refresh
// that rebuilds the page can never reset it to something the reader has scrolled away from.
function spyNow(){
  if(!isWide()) return;
  const top = document.querySelector('.top'), topH = top ? top.offsetHeight : 48;
  const doc = document.documentElement;
  // At the very bottom the last row may never reach the reading line on a short page; read from just above the footer.
  const atEnd = doc.scrollHeight > innerHeight + 2 && scrollY + innerHeight >= doc.scrollHeight - 2;
  const line = atEnd ? innerHeight - 100 : topH + (innerHeight - topH) * .25;
  const under = VIEWS.map(id=>{ const el = document.getElementById(id); return el && {id, r:el.getBoundingClientRect()}; })
    .filter(x=>x && x.r.top <= line && x.r.bottom > line);
  if(!under.length) return;
  const next = under.some(x=>x.id===navView) ? navView : under.sort((a,b)=>a.r.left-b.r.left)[0].id;
  if(next !== navView){ navView = next; paintNav(next); }
}
let spyQueued = false;
addEventListener('scroll', ()=>{
  if(spyQueued) return;
  spyQueued = true;
  requestAnimationFrame(()=>{ spyQueued = false; spyNow(); });
}, {passive:true});
addEventListener('resize', spyNow);
