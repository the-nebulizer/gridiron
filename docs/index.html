<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gridiron — Battle for the Gridiron Throne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Graduate&family=Barlow+Semi+Condensed:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="marked.min.js"></script>
<style>
  :root{
    --turf:#0C1D12; --pitch:#15291C; --pitch-2:#182F20; --line:#24422F;
    --chalk:#F2F5EB; --chalk-dim:#A8BCA9; --amber:#FFB41F; --flag:#F0503A;
    --display:'Graduate',serif; --body:'Barlow Semi Condensed',system-ui,sans-serif;
    --mono:'Spline Sans Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--turf);color:var(--chalk);font-family:var(--body);font-size:17px;line-height:1.55}
  a{color:var(--amber);text-decoration:none}
  a:hover,a:focus-visible{text-decoration:underline}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  .wrap{max-width:960px;margin:0 auto;padding:0 20px 90px}

  .field{background-image:repeating-linear-gradient(90deg,transparent 0 95px,rgba(242,245,235,.06) 95px 96px);border-bottom:1px solid var(--line)}
  header.masthead{max-width:960px;margin:0 auto;padding:30px 20px 22px;display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .wordmark{font-family:var(--display);font-size:clamp(24px,4vw,34px);letter-spacing:.04em}
  .wordmark .throne{color:var(--amber)}
  .weekchip{font-family:var(--mono);font-size:14px;color:var(--chalk-dim)}
  .weekchip b{color:var(--amber);font-weight:500}

  section{margin-top:52px}
  h2{font-family:var(--display);font-size:16px;font-weight:400;letter-spacing:.12em;color:var(--chalk);margin:0 0 6px;text-transform:uppercase}
  .sub{font-size:15px;color:var(--chalk-dim);margin:0 0 18px}

  /* alert rows: the card's heads-up list, and the "nothing here" lines in the feeds */
  .item{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:baseline}
  .item:last-child{border-bottom:0}
  .tag{font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:2px 7px;border:1px solid;flex-shrink:0;text-transform:uppercase}
  .tag.now{color:var(--flag);border-color:var(--flag)}
  .tag.soon{color:var(--amber);border-color:var(--amber)}
  .tag.watch{color:var(--chalk-dim);border-color:var(--line)}
  .item .what{min-width:0}
  .item .what b{color:var(--chalk);font-weight:600}
  .item .why{color:var(--chalk-dim);font-size:15px;display:block;margin-top:2px}
  .allclear{padding:22px 20px;color:var(--chalk-dim)}

  /* do now — the headline card: the routines' moves first, then what the page works out itself */
  .donow{margin-top:32px;border:1px solid var(--line);border-top:3px solid var(--amber);background:var(--pitch)}
  .donow .dhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px 18px;flex-wrap:wrap;padding:16px 22px 14px;border-bottom:1px solid var(--line)}
  .donow .dtitle{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .donow .dhead h2{margin:0}
  .dcount{font-family:var(--mono);font-size:13px;color:var(--chalk-dim)}
  .dcount b{color:var(--amber);font-weight:500}
  .act{display:grid;grid-template-columns:18px 1fr auto;gap:3px 12px;padding:14px 22px;border-bottom:1px solid var(--line)}
  .act:last-child{border-bottom:0}
  .act .glyph{font-family:var(--mono);font-size:14px;line-height:1.6;color:var(--amber)}
  .act.done .glyph{color:var(--chalk-dim)}
  .act.gone .glyph{color:var(--flag)}
  .act .move{font-weight:600;font-size:18px;min-width:0}
  .act.done .move{color:var(--chalk-dim);font-weight:500}
  .act .move .meta{font-family:var(--mono);font-size:13px;font-weight:400;color:var(--chalk-dim)}
  .act .chip{font-family:var(--mono);font-size:12px;color:var(--amber);border:1px solid var(--line);padding:2px 9px;white-space:nowrap;align-self:start;justify-self:end}
  .act.done .chip,.act.gone .chip{color:var(--chalk-dim)}
  .act .why{grid-column:2/-1;font-size:16px;color:var(--chalk-dim)}
  /* dependents: drawn under the action they wait on, indented with padding — no extra columns */
  .act.waiting .glyph,.act.superseded .glyph{color:var(--chalk-dim)}
  .act.waiting .move,.act.superseded .move{color:var(--chalk-dim);font-weight:500}
  .act .lead{font-family:var(--mono);font-size:12px;font-weight:400;letter-spacing:.04em;color:var(--chalk-dim)}
  .act.nest{border-bottom-style:dotted}
  .act.nest-1{padding-left:46px}
  .act.nest-2{padding-left:70px}
  .act.nest-3{padding-left:94px}
  /* the sendable offer text, folded away until Ben wants to copy it */
  .act .offer{grid-column:2/-1;margin-top:5px}
  .act .offer summary{font-family:var(--mono);font-size:12px;color:var(--chalk-dim);cursor:pointer;list-style:none}
  .act .offer summary::-webkit-details-marker{display:none}
  .act .offer summary::before{content:'▸ '}
  .act .offer[open] summary::before{content:'▾ '}
  .act .offer summary:hover{color:var(--amber)}
  .act .offer pre{font-family:var(--mono);font-size:13px;line-height:1.55;color:var(--chalk);
    background:var(--pitch-2);border:1px solid var(--line);padding:11px 13px;margin:7px 0 0;
    white-space:pre-wrap;overflow-wrap:anywhere}
  .act .src{grid-column:2/-1;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--chalk-dim);margin-top:2px}
  .act .dismiss{font-family:var(--mono);font-size:12px;background:none;border:1px solid var(--line);color:var(--chalk-dim);padding:2px 9px;cursor:pointer}
  .act .dismiss:hover{border-color:var(--amber);color:var(--amber)}
  .donow .none{padding:18px 22px;color:var(--chalk-dim)}
  .donow .none b{color:var(--chalk);font-weight:600}
  .donow .none .next{font-family:var(--mono);font-size:13px}
  .donedrop{border-top:1px solid var(--line)}
  .donedrop summary{font-family:var(--mono);font-size:13px;color:var(--chalk-dim);padding:11px 22px;cursor:pointer;list-style:none}
  .donedrop summary::-webkit-details-marker{display:none}
  .donedrop summary::before{content:'▸ ';color:var(--chalk-dim)}
  .donedrop[open] summary::before{content:'▾ '}
  .donedrop summary:hover{color:var(--amber)}
  .donedrop .act{border-top:1px solid var(--line);border-bottom:0}
  .heads{border-top:1px solid var(--line);background:var(--pitch-2)}
  .heads .htitle{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--chalk-dim);padding:13px 22px 0}
  .heads .item{padding:11px 22px;border-bottom:0}
  .heads .item + .item{border-top:1px solid var(--line)}
  .drift{border-top:1px solid var(--line);padding:11px 22px;font-family:var(--mono);font-size:12px;color:var(--chalk-dim)}

  .scorebug{border:1px solid var(--line);border-top:3px solid var(--amber);background:var(--pitch);display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
  .side{padding:18px 22px;min-width:0}
  .side.opp{text-align:right}
  .side .team{font-size:20px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side .rec{font-family:var(--mono);font-size:13px;color:var(--chalk-dim);margin-top:2px}
  .side .pts{font-family:var(--mono);font-size:clamp(30px,6vw,42px);color:var(--amber);line-height:1.15;margin-top:4px}
  .vs{font-family:var(--display);font-size:13px;color:var(--chalk-dim);padding:0 16px;align-self:stretch;display:flex;align-items:center;border-left:1px solid var(--line);border-right:1px solid var(--line)}

  .lineup{border:1px solid var(--line);background:var(--pitch);margin-top:14px}
  .lineup .head{display:grid;grid-template-columns:1fr 76px 1fr;font-family:var(--mono);font-size:13px;color:var(--chalk-dim);border-bottom:1px solid var(--line)}
  .lineup .head div{padding:10px 16px}
  .lineup .head .r{text-align:right}
  .slotrow{display:grid;grid-template-columns:1fr 76px 1fr}
  .slotrow:nth-child(even){background:var(--pitch-2)}
  .slot{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--chalk-dim);display:flex;align-items:center;justify-content:center}
  .pcell{padding:10px 16px;min-width:0}
  .pcell.opp{text-align:right}
  .pline{display:flex;align-items:baseline;gap:8px;min-width:0}
  .pcell.opp .pline{flex-direction:row-reverse}
  .pname{font-weight:500;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ppts{font-family:var(--mono);font-size:14px;color:var(--amber);margin-left:auto;flex-shrink:0}
  .pcell.opp .ppts{margin-left:0;margin-right:auto}
  .kick{font-family:var(--mono);font-size:12px;color:var(--chalk-dim);margin-top:2px}
  .kick.live{color:var(--amber)}
  .badge{font-family:var(--mono);font-size:11px;padding:1px 6px;border:1px solid;flex-shrink:0}
  .badge.q{color:var(--amber);border-color:var(--amber)}
  .badge.out{color:var(--flag);border-color:var(--flag)}
  .lineup.solo .head,.lineup.solo .slotrow{grid-template-columns:76px 1fr}
  .nogame{padding:12px 16px;color:var(--chalk-dim);border-bottom:1px solid var(--line)}
  .benchnote{padding:12px 16px;font-size:16px;color:var(--chalk-dim);border-top:1px solid var(--line);line-height:1.7}
  .benchnote b{color:var(--chalk);font-weight:500}

  /* league activity */
  .feed{border:1px solid var(--line);background:var(--pitch)}
  .move{padding:13px 20px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
  .move:last-child{border-bottom:0}
  .move .who{font-weight:600;min-width:150px}
  .move .did{color:var(--chalk-dim);flex:1;min-width:220px}
  .move .did .in{color:var(--chalk)}
  .move .when{font-family:var(--mono);font-size:12px;color:var(--chalk-dim);margin-left:auto}
  .free{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--amber);border:1px solid var(--amber);padding:1px 6px}

  .tabs{display:flex;gap:8px;flex-wrap:wrap}
  .tab{font-family:var(--mono);font-size:14px;background:none;border:1px solid var(--line);color:var(--chalk-dim);padding:8px 16px;cursor:pointer}
  .tab[aria-selected="true"]{background:var(--pitch);color:var(--amber);border-color:var(--amber);border-bottom-color:var(--pitch)}
  .brief{border:1px solid var(--line);background:var(--pitch);padding:8px 28px 24px}
  .brief-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:14px 0;font-family:var(--mono);font-size:13px;color:var(--chalk-dim)}
  .runlink{font-family:var(--mono);font-size:13px;border:1px solid var(--amber);color:var(--amber);padding:6px 14px;white-space:nowrap}
  .runlink:hover{background:var(--amber);color:var(--turf);text-decoration:none}
  .missed{color:var(--flag)}
  .dim{color:var(--chalk-dim)}
  .report{max-width:70ch}
  .report h1{font-size:24px;line-height:1.3;margin:22px 0 10px}
  .report h2,.report h3{font-family:var(--body);font-size:19px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--chalk);margin:26px 0 8px;display:block}
  .report p,.report li{font-size:17px;color:var(--chalk)}
  .report em{color:var(--chalk-dim)}
  .report strong{color:var(--amber);font-weight:600}
  .report code{font-family:var(--mono);font-size:14px;background:var(--pitch-2);padding:1px 5px}
  .report blockquote{margin:14px 0;padding:2px 18px;border-left:3px solid var(--line);color:var(--chalk-dim)}
  .empty{padding:26px 0 14px;color:var(--chalk-dim)}

  table{width:100%;border-collapse:collapse;font-size:17px}
  th{font-family:var(--mono);font-size:12px;font-weight:400;letter-spacing:.06em;color:var(--chalk-dim);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);text-transform:uppercase}
  th.r{text-align:right}
  td{padding:9px 10px;border-bottom:1px solid var(--line)}
  tbody tr:nth-child(even){background:var(--pitch)}
  td.num{font-family:var(--mono);font-size:14px;text-align:right;color:var(--chalk-dim)}
  tr.me td{color:var(--amber)}
  tr.me td.num{color:var(--amber)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:56px}

  footer{margin-top:70px;padding-top:18px;border-top:1px solid var(--line);font-family:var(--mono);font-size:13px;color:var(--chalk-dim);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  button.refresh{font-family:var(--mono);font-size:13px;background:none;border:1px solid var(--line);color:var(--chalk);padding:5px 14px;cursor:pointer}
  button.refresh:hover{border-color:var(--amber);color:var(--amber)}
  .notice{font-family:var(--mono);font-size:13px;color:var(--chalk-dim);border:1px solid var(--line);padding:8px 14px;margin:20px 0 -12px}
  .loading,.error{padding:70px 0;text-align:center;color:var(--chalk-dim);font-family:var(--mono);font-size:15px}
  .error b{color:var(--flag)}

  @media (max-width:720px){
    .cols{grid-template-columns:1fr}
    .slotrow,.lineup .head{grid-template-columns:1fr 52px 1fr}
    .lineup.solo .head,.lineup.solo .slotrow{grid-template-columns:52px 1fr}
    .brief{padding:6px 16px 18px}
    .move .when{margin-left:0}
    .act{grid-template-columns:18px 1fr;padding:13px 16px}
    .act .chip{grid-column:2;justify-self:start;margin-top:2px}
    .act.nest-1{padding-left:34px}
    .act.nest-2{padding-left:52px}
    .act.nest-3{padding-left:70px}
    .donow .dhead,.donow .none,.drift,.donedrop summary,.heads .htitle,.heads .item{padding-left:16px;padding-right:16px}
  }
  @media (prefers-reduced-motion:no-preference){
    .donow{animation:drop .35s ease-out}
    @keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  }
</style>
</head>
<body>
<div class="field">
  <header class="masthead">
    <div class="wordmark">GRIDIRON <span class="throne">THRONE</span></div>
    <div class="weekchip" id="weekchip">loading…</div>
  </header>
</div>
<div class="wrap">
  <p class="notice" id="notice" hidden></p>
  <main id="app"><div class="loading">Reading the field…</div></main>
  <footer>
    <span>Live from Sleeper · moves happen in the Sleeper app</span>
    <span><span id="stamp"></span> <button class="refresh" id="refresh">Refresh</button></span>
  </footer>
</div>

<script>
const CFG = { league:'1353093442397294592', me:12, repo:'the-nebulizer/gridiron' };
// day/hour: when each routine fires (UTC), so the page can tell when one ran but left nothing.
// The activity note is written by hand, not by a routine, so it has no schedule and no "Run fresh".
const ROUTINES = {
  activity: {label:'Activity',  id:null, day:null, hour:null, auto:''},
  waivers:  {label:'Waivers',   id:'trig_018jkMrmz2vDLU6qQdiGeKZE', day:2, hour:12, auto:'runs Tuesdays, ahead of Wednesday claims'},
  lineup:   {label:'Lineup',    id:'trig_01DxqQ5pTd1sJRc8CSnX4YHy', day:4, hour:12, auto:'runs Thursdays'},
  inactives:{label:'Inactives', id:'trig_01WEymfugQorRLQeP2YLdvqx', day:0, hour:15, auto:'runs Sunday mornings'},
  trades:   {label:'Trades',    id:'trig_01Jr9ik2fKEiwcs4yaS99ZeQ', day:1, hour:12, auto:'runs Mondays'},
};
const WATCHER = {label:'Roster watcher', id:'trig_01DTuqiqG69gfwSjFfW65vah',
  auto:'checks hourly, and rewrites the brief after any move you make'};
const API = 'https://api.sleeper.app';
const MIN = 60*1000, HOUR = 60*MIN, DAY = 24*HOUR;
const $ = (id)=>document.getElementById(id);
const esc = (s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function j(url){ const r = await fetch(url); if(!r.ok) throw new Error(r.status+' '+url); return r.json(); }

/* ——— caching: the big feeds barely change, so don't pull them every two minutes ——— */
const mem = {};
const store = {
  get(k){ try{ const s = localStorage.getItem('gt:'+k); return s ? JSON.parse(s) : null; }catch{ return null; } },
  set(k,v){ try{ localStorage.setItem('gt:'+k, JSON.stringify(v)); }catch{} },
};
// Serve from memory (or localStorage when persist is set) while fresh; on a failed refetch, fall back to the stale copy.
async function cached(key, ttlMs, fetcher, {persist=false}={}){
  const now = Date.now();
  const hit = mem[key] || (persist ? store.get(key) : null);
  if(hit && hit.v && now - hit.t < ttlMs){ mem[key] = hit; return hit.v; }
  try{
    const v = await fetcher();
    const rec = {t:now, v};
    mem[key] = rec;
    if(persist) store.set(key, rec);
    return v;
  }catch(e){
    if(hit && hit.v){ mem[key] = hit; return hit.v; }
    throw e;
  }
}
// The full player file is 12,000 players × 50 fields; we need four fields, and mostly for a few hundred of them.
function trimPlayers(raw){
  const out = {};
  for(const id in raw){
    const p = raw[id] || {}, o = {};
    const n = p.full_name || ((p.first_name||'')+' '+(p.last_name||'')).trim();
    if(n) o.n = n;
    if(p.position) o.p = p.position;
    if(p.team) o.t = p.team;
    if(p.injury_status) o.i = p.injury_status;
    out[id] = o;
  }
  return out;
}

/* ——— shaping the raw feeds ——— */
function resolve(players, id){
  if(!id || id==='0') return null;
  const p = players[id];
  if(!p) return {id, name:/^[A-Z]{2,3}$/.test(id)?id+' DEF':'#'+id, pos:/^[A-Z]{2,3}$/.test(id)?'DEF':'?', team:id, inj:null};
  return { id, name:p.n || id, pos:p.p||'?', team:p.t||'—', inj:p.i||null };
}
// A team's bye is the one week it has no game on the schedule.
function byeWeeks(schedule){
  const weeks = [...new Set(schedule.map(g=>g.week))].sort((a,b)=>a-b);
  const played = {};
  schedule.forEach(g=>[g.home,g.away].forEach(t=>{ (played[t] = played[t]||new Set()).add(g.week); }));
  const byes = {};
  Object.entries(played).forEach(([t,ws])=>{ const b = weeks.filter(w=>!ws.has(w)); if(b.length===1) byes[t]=b[0]; });
  return byes;
}
// team -> this week's game: who, when, on what channel, and whether it's under way.
function gamesByTeam(scores){
  const out = {};
  for(const g of scores){
    const m = g.metadata || {};
    if(!m.home_team || !m.away_team) continue;
    const common = {kick:m.date_time?new Date(m.date_time):null, tv:m.channel||'', live:!!m.is_in_progress,
                    over:!!m.is_over, started:!!m.has_started, quarter:m.quarter||''};
    out[m.home_team] = {...common, opp:m.away_team, home:true};
    out[m.away_team] = {...common, opp:m.home_team, home:false};
  }
  return out;
}
const dayTime = (d)=> d ? d.toLocaleString(undefined,{weekday:'short',hour:'numeric',minute:'2-digit'}) : '';
// games is null when the scores feed didn't load; byes is null when the schedule didn't.
function gameLabel(games, byes, team, week){
  const onBye = !!byes && byes[team]===week;
  if(!games) return onBye ? 'on bye' : '';
  const g = games[team];
  if(!g) return onBye ? 'on bye' : 'no game listed';
  const side = (g.home?'vs ':'@ ')+g.opp;
  if(g.over) return side+' · final';
  if(g.live) return side+' · live'+(g.quarter?' '+g.quarter:'');
  return side+' · '+dayTime(g.kick)+(g.tv?' · '+g.tv:'');
}

// Which positions each starting slot accepts, and a maximum matching of players onto
// slots — the same model scripts/outlook.mjs uses, so the page and the reports can never
// disagree about whether a week is coverable. Counting by position is not an answer when
// FLEX and SUPER_FLEX exist: four QBs cover a QB bye, and two spare WRs do not cover a
// kicker's.
const SLOT_TAKES = {QB:['QB'], RB:['RB'], WR:['WR'], TE:['TE'], K:['K'], DEF:['DEF'],
  FLEX:['RB','WR','TE'], WRRB_FLEX:['RB','WR'], REC_FLEX:['WR','TE'], SUPER_FLEX:['QB','RB','WR','TE']};
function emptySlots(slotNames, pool){
  // Most restrictive slot first, so an unfillable week names the slot nobody can play
  // rather than whichever flex spot happened to be left over.
  const order = slotNames.map((name,idx)=>({name,idx}))
    .filter(x=>SLOT_TAKES[x.name])
    .sort((a,b)=>SLOT_TAKES[a.name].length - SLOT_TAKES[b.name].length);
  const filled = {}, slotOf = {};
  const augment = (idx, seen)=>{
    for(const p of pool){
      if(seen.has(p.id) || !SLOT_TAKES[slotNames[idx]].includes(p.pos)) continue;
      seen.add(p.id);
      const held = slotOf[p.id];
      if(held === undefined || augment(held, seen)){ slotOf[p.id] = idx; filled[idx] = p; return true; }
    }
    return false;
  };
  for(const {idx} of order) augment(idx, new Set());
  return order.filter(({idx})=>!filled[idx]).map(({name})=>name);
}

/* ——— what needs Ben ——— */
function actionItems({me, players, games, byes, week, txns, rostered, trendAdd, trendDrop, slots}){
  const items = [];
  const starters = (me.starters||[]).map(id=>resolve(players,id)).filter(Boolean);

  // Two structural faults nothing else here catches, because they're about the slot, not the player:
  // an empty starting slot scores zero all week, and a healthy body parked on IR makes Sleeper
  // refuse to save the lineup at all.
  (slots||[]).forEach((slot,i)=>{
    const id = (me.starters||[])[i];
    if(id && id!=='0') return;
    items.push({urgency:'now',
      what:`Your ${slot.replace('SUPER_FLEX','SUPERFLEX')} slot is empty`,
      why:'Nobody is in it, so it scores nothing — fill it before kickoff.'});
  });
  for(const p of (me.reserve||[]).map(id=>resolve(players,id)).filter(Boolean)){
    if(p.inj) continue;
    items.push({urgency:'soon', id:p.id,
      what:`${p.name} (${p.pos}) is on IR with no injury designation`,
      why:'Sleeper blocks lineup changes until he is moved back to the bench.'});
  }

  // A player on IR or PUP can't fill an active roster spot, so he isn't an option.
  const stashed = (p)=> /ir|pup|^na$|sus/i.test(p.inj||'');
  const seen = new Set();

  // Free-agent items need the trending feeds; without them there's no way to size demand.
  if(trendAdd && trendDrop){
    const net = (id)=> (trendAdd[id]||0) - (trendDrop[id]||0);

    // Players other managers let go who nobody has claimed.
    for(const t of (txns||[])){
      for(const id of Object.keys(t.drops||{})){
        if(rostered.has(id) || seen.has(id)) continue;
        seen.add(id);
        const p = resolve(players,id); if(!p || stashed(p)) continue;
        if(net(id) <= 0) continue;                 // the market agrees with the drop; skip
        items.push({urgency:'soon', id,
          what:`${p.name} (${p.pos} ${p.team}) is still unclaimed`,
          why:`Dropped in your league and nobody took him. ${net(id).toLocaleString()} more managers adding than dropping him across Sleeper.`});
      }
    }

    // The best players nobody here has, whether or not they were ever dropped —
    // the strongest demand across Sleeper, filtered to what's actually available.
    Object.keys(trendAdd)
      .filter(id=>!rostered.has(id) && !seen.has(id) && net(id) > 0)
      .map(id=>({id, p:resolve(players,id)}))
      .filter(x=>x.p && !stashed(x.p))
      .sort((a,b)=>net(b.id)-net(a.id))
      .slice(0,2)
      .forEach(({id,p})=>{
        seen.add(id);
        items.push({urgency:'soon', id,
          what:`${p.name} (${p.pos} ${p.team}) is free and in demand`,
          why:`Nobody in your league has him. ${net(id).toLocaleString()} more managers adding than dropping him across Sleeper — the biggest number on the board that's still available.`});
      });
  }

  // Starters carrying an injury tag, with the kickoff you have to decide by.
  for(const p of starters){
    if(!p.inj) continue;
    const g = games ? games[p.team] : null;
    const out = /out|ir|pup|doubtful/i.test(p.inj);
    // keep: an injured man in the lineup is the one alert no routine instruction may hide.
    items.push({urgency: out?'now':'soon', id:p.id, keep:true,
      what:`${p.name} is ${p.inj.toLowerCase()}`,
      why: g && !g.started && g.kick ? `Starting at ${p.pos}. Decide before ${dayTime(g.kick)}.` : `Starting at ${p.pos}.`});
  }

  // A benched player who is out for the season is the one status change nothing
  // else here would catch: he isn't starting, so the starter checks skip him, and
  // he quietly occupies a roster spot.
  const startSet = new Set(me.starters||[]);
  const benched = (me.players||[]).filter(id=>!startSet.has(id) && !(me.reserve||[]).includes(id))
    .map(id=>resolve(players,id)).filter(Boolean);
  for(const p of benched){
    if(!/ir|out|pup|^na$|sus/i.test(p.inj||'')) continue;
    const irFree = !(me.reserve||[]).length;
    items.push({urgency:'soon', id:p.id,
      what:`${p.name} (${p.pos}) is ${p.inj.toLowerCase()} on your bench`,
      why: irFree
        ? `He can't be started. Your IR slot is free — move him there and you get the bench spot back.`
        : `He can't be started and your IR slot is taken, so he's a roster spot doing nothing.`});
  }

  // Bye trouble in the next three weeks, while there's still time to plan for it.
  // Whether a week is actually coverable is solved against the real slots, not guessed
  // from the position on bye: this used to call any QB/TE/K/DEF bye uncoverable (false
  // with four quarterbacks) and any RB/WR bye covered (false with no spare bodies).
  if(byes){
    const active = (me.players||[]).filter(id=>!(me.reserve||[]).includes(id))
      .map(id=>resolve(players,id)).filter(Boolean);
    for(let w=week+1; w<=week+3; w++){
      const outThisWeek = active.filter(p=>byes[p.team]===w);
      if(!outThisWeek.length) continue;
      const gaps = emptySlots(slots||[], active.filter(p=>byes[p.team]!==w));
      const named = outThisWeek.filter(p=>(me.starters||[]).includes(p.id));
      items.push({urgency: gaps.length ? (w===week+1?'now':'soon') : (w===week+1?'soon':'watch'),
        what:`Week ${w}: ${(named.length?named:outThisWeek).map(p=>p.name).join(', ')} on bye`,
        why: gaps.length
          ? `No one on your roster can fill ${gaps.map(g=>g.replace('SUPER_FLEX','SUPERFLEX')).join(' or ')} that week — plan a claim.`
          : 'Covered from the bench.'});
    }
  }

  const rank = {now:0, soon:1, watch:2};
  return items.sort((a,b)=>rank[a.urgency]-rank[b.urgency]);
}

/* ——— do-now: pure logic. Covered by `npm test`, which lifts these functions out of this
   file and holds them to scripts/actions.mjs and scripts/outlook.mjs: two copies of one
   rule drift, and the card and the compiler must never disagree about what "done" means. ——— */
const URGENCY = ['now','before_kickoff','by_tuesday','this_week','optional'];
const DEADLINE = {now:'now', before_kickoff:'before kickoff', by_tuesday:'by Tue night',
                  this_week:'this week', optional:'optional'};
const urgRank = (u)=>{ const i = URGENCY.indexOf(u); return i<0 ? URGENCY.length : i; };
// Keyed by the report that proposed the trade, not by compiled_at: the watcher recompiles after
// any move, so a compiled_at key made Dismiss a one-hour snooze. A dismissal now lasts until a
// NEWER report of that type supersedes it — a new filename is a new key, so the offer comes back.
const dismissKey = (a)=> `${a.id||''}|${a.report||''}`;
const titleCase = (s)=> String(s||'').charAt(0).toUpperCase()+String(s||'').slice(1);
const prettySlot = (s)=> String(s||'').replace('SUPER_FLEX','SUPERFLEX');
// ...and the same order as a sort key: lineup first, then the roster moves that ride on
// Wednesday's claims, then trades. A kind the compiler shouldn't emit sorts last, never first.
const KIND_RANK = {start:0, add:1, drop:1, ir:1, activate:1, trade:2};
const kindRank = (k)=> KIND_RANK[k]==null ? 3 : KIND_RANK[k];

/* Dependency resolution. Items arrive carrying the base state actionState gave them; `after` and
   `if_not` name another action in the same compiled file. Pure, and re-runnable: the base state
   is kept on the item, so dismissing a trade can re-resolve the whole set on the spot. */
const BLOCKING = {open:1, waiting:1};
function resolveDependencies(items){
  const list = (Array.isArray(items) ? items : []).filter(i=>i && typeof i==='object');
  const idx = new Map();
  list.forEach((i,n)=>{ const k = i.id==null ? '' : String(i.id); if(k && !idx.has(k)) idx.set(k,n); });
  // A parent that isn't in the file is no parent at all: the child stands as a primary rather
  // than waiting forever on something the card can never show.
  const edgeTo = (i,n,field)=>{
    const raw = i[field]; if(raw==null || raw==='') return null;
    const p = idx.get(String(raw));
    return (p==null || p===n) ? null : p;
  };
  const edges = list.map((i,n)=>({after:edgeTo(i,n,'after'), if_not:edgeTo(i,n,'if_not')}));
  // Break the link that closes a loop, so a cycle can hang neither the resolver nor the renderer.
  const seen = new Array(list.length).fill(0);
  const walk = (n)=>{
    seen[n] = 1;
    for(const f of ['after','if_not']){
      const p = edges[n][f];
      if(p==null) continue;
      if(seen[p]===1) edges[n][f] = null;        // back edge
      else if(seen[p]===0) walk(p);
    }
    seen[n] = 2;
  };
  list.forEach((_,n)=>{ if(seen[n]===0) walk(n); });

  // When an action has both links, the more restrictive outcome wins.
  const RANK = {waiting:3, gone:2, superseded:1};
  const memo = new Array(list.length);
  const res = (n)=>{
    if(memo[n]) return memo[n];
    const i = list[n];
    const base = i.base_state || i.state || 'open';
    let state = base, parent = null, link = null, rank = 0;
    for(const f of ['after','if_not']){
      const p = edges[n][f];
      if(p==null) continue;
      const par = res(p), ps = par.state;
      const s = BLOCKING[ps] ? 'waiting'
              : ps==='done'  ? (f==='after' ? base : 'superseded')
              : (f==='after' ? 'gone' : base);   // gone · dismissed · stale · superseded
      const r = RANK[s] || 0;
      if(r > rank){ rank = r; state = s; parent = par; link = f; }
    }
    // Only a waiting dependent is drawn under its parent; promoted, gone and superseded ones
    // stand (or are shelved) on their own.
    const nested = state==='waiting' && !!parent;
    const out = {...i, base_state:base, state,
      parent_id: nested ? (parent.id==null ? null : String(parent.id)) : null,
      link: nested ? link : null,
      depth: nested ? (parent.depth||0) + 1 : 0};
    memo[n] = out;
    return out;
  };
  return list.map((_,n)=>res(n));
}

/* live = {week, players:Set(my ids), starters:[], reserve:[],
           ownerOf(id)->name|null, dismissed:Set(keys)} */
function actionState(a, live){
  // Ids come out of JSON, so one arriving as a number would silently miss a Set of strings —
  // and a missed `drop` reads as "done", i.e. the card claiming a move Ben never made.
  const S = (x)=> x==null ? '' : String(x);
  const starters = (live.starters||[]).map(S), reserve = (live.reserve||[]).map(S);
  // Sleeper puts IR players in `players` too, but don't rely on it: starters and reserve count.
  const has = (id)=>{ const s = S(id);
    return !!s && (live.players.has(s) || starters.includes(s) || reserve.includes(s)); };
  const player = S(a.player);
  // Sleeper flips its week number on Tuesday, so only a start/sit instruction expires with the week.
  // An add, a drop, an IR move or a trade is still the right move on Wednesday.
  const wk = a.week==null ? live.week : a.week;
  if(a.kind==='start' && wk < live.week) return {state:'stale'};
  const dismissed = live.dismissed && live.dismissed.has(dismissKey(a));
  // A start/IR/activate instruction about a player who has since left the roster can't be carried
  // out at all. Shelve it as gone rather than leaving an impossible move in the open list.
  const lost = ()=> ({state:'gone', owner: (live.ownerOf && live.ownerOf(player)) || null});
  switch(a.kind){
    case 'add': {
      if(has(player)) return {state:'done'};
      const o = live.ownerOf ? live.ownerOf(player) : null;
      if(o) return {state:'gone', owner:o};
      return {state:'open'};
    }
    case 'drop':     return {state: has(player) ? 'open' : 'done'};
    case 'start':    return starters.includes(player) && (!a.for || !starters.includes(S(a.for)))
                       ? {state:'done'} : has(player) ? {state:'open'} : lost();
    case 'ir':       return reserve.includes(player) ? {state:'done'}
                       : has(player) ? {state:'open'} : lost();
    case 'activate': return has(player) && !reserve.includes(player) ? {state:'done'}
                       : has(player) ? {state:'open'} : lost();
    case 'trade': {
      const get = Array.isArray(a.get) ? a.get : [];
      const give = Array.isArray(a.give) ? a.give : [];
      if(get.length && get.every(has)) return {state:'done'};
      // An offer you can no longer honour is not an instruction. The compiler already
      // shelves these; the card used to keep showing them as open, telling Ben to send
      // an offer built on a player he had dropped or traded away.
      if(give.length && !give.every(has)) return {state:'gone'};
      // Same the other way: the other manager may have moved the player it asks for.
      if(get.length && live.ownerOf && a.with_owner &&
         !get.every(id=> has(id) || live.ownerOf(S(id))===a.with_owner)) return {state:'gone'};
      return {state: dismissed ? 'dismissed' : 'open'};
    }
  }
  return {state:'open'};
}

function actionHeadline(i){
  const nm = (n,pos,team)=> `${esc(n||'?')}${pos?` <span class="meta">(${esc(pos)} · ${esc(team||'—')})</span>`:''}`;
  const list = (v)=> (Array.isArray(v)?v:[]).map(esc).join(', ');
  // Gone is a statement of fact, never an instruction: say who has him, or that he's off the roster.
  if(i.state==='gone' && i.kind!=='trade')
    return `${nm(i.name,i.pos,i.team)} — ${i.owner ? `taken by ${esc(i.owner)}` : 'no longer on your roster'}`;
  switch(i.kind){
    case 'add': {
      const bid = (i.mode==='waiver' && i.faab!=null) ? `, bid $${esc(i.faab)}` : '';
      return `Add ${nm(i.name,i.pos,i.team)}${i.drop_name?`, drop ${esc(i.drop_name)}`:''}${bid}`;
    }
    case 'drop':     return `Drop ${nm(i.name,i.pos,i.team)}`;
    case 'start':    return `Start ${nm(i.name,i.pos,i.team)} at ${esc(prettySlot(i.slot))}${i.for_name?`, bench ${esc(i.for_name)}`:''}`;
    case 'ir':       return `Move ${nm(i.name,i.pos,i.team)} to IR`;
    case 'activate': return `Activate ${nm(i.name,i.pos,i.team)} from IR`;
    case 'trade':    return `Offer ${list(i.give_names)||'—'} to ${esc(i.with_owner||('roster '+i.with))} for ${list(i.get_names)||'—'}`;
  }
  // A kind the compiler shouldn't emit: still name the player rather than printing a bare verb.
  return `${esc(titleCase(i.kind||'—'))} ${nm(i.name,i.pos,i.team)}`.trim();
}

/* o = {num} for a numbered primary, or {depth, parent} for a dependent drawn under it. */
function actionRow(i, m, o){
  o = o || {};
  const nested = !!o.parent;
  const depth = Math.max(0, Math.min(3, Math.round(Number(o.depth)||0)));
  // A numbered primary carries its place in the standing order; a dependent carries a muted hook.
  const glyph = i.state==='done' ? '✓' : i.state==='gone' ? '✕' : i.state==='superseded' ? '⊘'
    : o.num ? String(o.num) : nested ? '↳' : '●';
  const chip = i.deadline_label || DEADLINE[i.urgency] || 'when you can';
  const date = (String(i.report||'').match(/^\d{4}-\d{2}-\d{2}/)||[String(i.report||'').replace(/\.md$/,'')])[0];
  const dism = (i.kind==='trade' && i.state==='open')
    ? `<button class="dismiss" data-dismiss="${esc(dismissKey(i))}">Dismiss</button>` : '';
  // Drop the parts that aren't there rather than printing " · · ".
  const src = [titleCase(i.source), date, `verified live ${m.now}`].filter(Boolean).map(esc).join(' · ');
  // The offer text the routine wrote for Ben to paste into Sleeper. Only worth showing while
  // the trade is still his to send, so it's folded away on a live open trade and nowhere else.
  const offer = (i.kind==='trade' && i.state==='open' && typeof i.message==='string' && i.message.trim())
    ? `<details class="offer"><summary>Offer message</summary><pre>${esc(i.message)}</pre></details>` : '';
  // What the link means, in Ben's words: do this next, or do this instead.
  const lead = nested
    ? `<span class="lead">${i.link==='if_not' ? 'If that falls through:' : 'Then:'}</span> ` : '';
  return `<div class="act ${esc(i.state)}${depth ? ` nest nest-${depth}` : ''}">
      <div class="glyph" aria-hidden="true">${esc(glyph)}</div>
      <div class="move">${lead}${actionHeadline(i)}</div>
      <div class="chip">${esc(chip)}</div>
      ${i.why ? `<div class="why">${esc(i.why)}</div>` : ''}
      ${offer}
      <div class="src"><span>${src}</span>${dism}</div>
    </div>`;
}

/* m = {ok, week, now, league, items:[action+state, resolved by resolveDependencies],
        alerts:[actionItems() output], nextCheck, drift} */
function renderDoNow(m){
  const items = (m.items||[]).filter(i=>i.state!=='stale' && i.state!=='dismissed');
  // Primaries are everything open that isn't hanging off another action, numbered in the
  // standing order: lineup, then claims, then trades; urgency, then report date, within each.
  const open = items.filter(i=>i.state==='open' && !i.parent_id)
    .sort((a,b)=> kindRank(a.kind)-kindRank(b.kind)
               || urgRank(a.urgency)-urgRank(b.urgency)
               || String(b.report||'').localeCompare(String(a.report||'')));
  const shelved = items.filter(i=>i.state==='done' || i.state==='gone' || i.state==='superseded');
  const alerts = m.alerts||[];

  // Waiting dependents hang under their parent. They are not instructions yet, so they are
  // drawn muted and are not counted in the "n open" chip.
  const kidsOf = new Map();
  items.filter(i=>i.state==='waiting' && i.parent_id!=null && i.parent_id!=='').forEach(i=>{
    const k = String(i.parent_id);
    if(!kidsOf.has(k)) kidsOf.set(k, []);
    kidsOf.get(k).push(i);
  });
  const drawn = new Set();
  const branch = (parent, depth)=>{
    const kids = (kidsOf.get(parent.id==null ? '' : String(parent.id))||[])
      .filter(k=>!drawn.has(k))
      .sort((a,b)=> (a.link==='after'?0:1)-(b.link==='after'?0:1) || urgRank(a.urgency)-urgRank(b.urgency));
    return kids.map(k=>{ drawn.add(k); return actionRow(k, m, {depth, parent}) + branch(k, depth+1); }).join('');
  };
  let rows = open.map((i,n)=>{ drawn.add(i); return actionRow(i, m, {num:n+1}) + branch(i, 1); }).join('');
  // A dependent whose parent isn't on the card at all (a malformed file) is still shown, flat,
  // rather than silently dropped.
  const byId = new Map();
  items.forEach(i=>{ const k = i.id==null ? '' : String(i.id); if(k && !byId.has(k)) byId.set(k,i); });
  items.filter(i=>i.state==='waiting' && !drawn.has(i)).forEach(i=>{
    drawn.add(i);
    rows += actionRow(i, m, {depth:1, parent: byId.get(String(i.parent_id)) || {}});
  });

  let body = rows
    || `<div class="none">${ m.ok===false
        ? 'No actions compiled yet — the next routine run writes them.'
        : `<b>Nothing to do.</b> <span class="next">Next: ${esc(m.nextCheck||'Waivers run Tue 7am')}</span>` }</div>`;

  // "Done", "gone" and "superseded" are three different pieces of news: a move you made, one you
  // can no longer make, and a fallback you no longer need.
  if(shelved.length){
    const nDone = shelved.filter(i=>i.state==='done').length;
    const nGone = shelved.filter(i=>i.state==='gone').length;
    const nSup  = shelved.length - nDone - nGone;
    const label = [nDone?`Done (${nDone})`:'', nGone?`no longer possible (${nGone})`:'',
                   nSup?`superseded (${nSup})`:''].filter(Boolean).join(' · ');
    body += `<details class="donedrop"><summary>${label}</summary>${shelved.map(i=>actionRow(i,m)).join('')}</details>`;
  }

  // Heads up: what the page works out for itself from live Sleeper data. No judgment, never stale.
  if(alerts.length) body += `<div class="heads"><div class="htitle">Heads up</div>${
    alerts.map(a=>`<div class="item"><span class="tag ${esc(a.urgency)}">${esc(a.urgency)}</span>
      <span class="what"><b>${esc(a.what)}</b><span class="why">${esc(a.why)}</span></span></div>`).join('')}</div>`;

  if(m.drift) body += `<div class="drift">Your roster has changed since these were written — the watcher re-runs within the hour.</div>`;


  return `<div class="donow" id="donow">
      <div class="dhead">
        <div class="dtitle"><h2>Do now</h2><span class="dcount">Week ${esc(m.week)} · <b>${open.length} open</b></span></div>
        <a class="runlink" href="https://sleeper.com/leagues/${esc(m.league)}" target="_blank" rel="noopener">Open Sleeper ↗</a>
      </div>${body}</div>`;
}
/* ——— end do-now pure ——— */

/* ——— do-now: live wiring ——— */
const DISMISS_KEY = 'gridiron.dismissed';
function dismissedSet(){
  try{ const raw = localStorage.getItem(DISMISS_KEY); return new Set(raw ? JSON.parse(raw) : []); }
  catch{ return new Set(); }
}
function rememberDismiss(key){
  try{ const s = dismissedSet(); s.add(key); localStorage.setItem(DISMISS_KEY, JSON.stringify([...s])); }catch{}
}
// actions.json is absent until the first routine run writes it, so a 404 is normal, not a failure —
// but a blip at GitHub is not the same thing as "no actions". Only a real 404 clears the card;
// anything else keeps the last good copy, so a two-minute refresh can't blank Ben's moves.
let lastActions = null;
async function fetchActions(url){
  try{
    const r = await fetch(url);
    if(r.status===404){ lastActions = null; return null; }
    if(!r.ok) return lastActions;
    return (lastActions = await r.json());
  }catch{ return lastActions; }
}
function pickNextCheck(sources){
  const all = Object.values(sources||{}).filter(s=>s && s.next_check);
  const freshest = (arr)=> arr.slice().sort((a,b)=>String(b.report||'').localeCompare(String(a.report||'')))[0];
  const pick = freshest(all.filter(s=>!s.stale)) || freshest(all);
  return pick ? pick.next_check : 'Waivers run Tue 7am';
}
function rosterDrifted(doc, myR){
  const r = doc && doc.roster;
  // No usable fingerprint is "can't tell", which is not the same as "it moved" — say nothing.
  if(!r || typeof r!=='object'
     || !(Array.isArray(r.starters) && Array.isArray(r.bench) && Array.isArray(r.reserve))) return false;
  // An empty starting slot is "0" live and null in the fingerprint; same fact, two spellings.
  const slot = (x)=> (x==null || x==='' || x==='0' || x===0) ? '—' : String(x);
  const starters = (myR.starters||[]).map(slot);
  const reserve  = (myR.reserve||[]).map(String);
  const rSet = new Set(reserve), sSet = new Set(starters);
  const bench = (myR.players||[]).map(String).filter(id=>!sSet.has(id) && !rSet.has(id)).sort();
  const same = (a,b)=> JSON.stringify(a||[]) === JSON.stringify(b||[]);
  return !(same(starters,(r.starters||[]).map(slot))
        && same(bench,(r.bench||[]).map(String).sort())
        && same(reserve.slice().sort(),(r.reserve||[]).map(String).sort()));
}
function wireDismiss(m){
  document.querySelectorAll('[data-dismiss]').forEach(b=>b.addEventListener('click', ()=>{
    const key = b.dataset.dismiss;
    rememberDismiss(key);
    // Re-resolve: a dismissed trade promotes the claim that was waiting behind it, right now.
    m.items = resolveDependencies(m.items.map(i=> dismissKey(i)===key
      ? {...i, state:'dismissed', base_state:'dismissed'} : i));
    const el = $('donow');
    if(el){ el.outerHTML = renderDoNow(m); wireDismiss(m); }
  }));
}

/* ——— the written brief ——— */
let reportFiles = null;          // null until GitHub has answered at least once; then the last good listing
let reportsCheckedAt = 0;
async function loadReports(){
  if(Date.now() - reportsCheckedAt < 10*MIN) return;   // GitHub rate-limits anonymous callers; ten minutes is plenty
  reportsCheckedAt = Date.now();
  try{ reportFiles = (await j(`https://api.github.com/repos/${CFG.repo}/contents/reports`))
        .filter(f=>f.name.endsWith('.md')); }
  catch{ /* keep the last good listing, if there is one */ }
}
const newestOf = (type)=> (reportFiles||[]).filter(f=>f.name.includes('-'+type)).sort((a,b)=>b.name.localeCompare(a.name))[0];
function reportDate(name){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(name);
  if(!m) return null;
  return new Date(+m[1], +m[2]-1, +m[3]);
}
const longDate = (d)=> d ? d.toLocaleDateString(undefined,{weekday:'long', month:'short', day:'numeric'}) : '';
// Did a routine's scheduled fire pass without a report? Silence should be visible — but only when we could
// actually check. The fire time is fixed in UTC, so work in UTC rather than the reader's local midnight.
function missedRun(type, file){
  const r = ROUTINES[type];
  if(r.day===null || !reportFiles) return null;
  const now = new Date();
  const last = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), r.hour));
  last.setUTCDate(last.getUTCDate() - ((now.getUTCDay() - r.day + 7) % 7));
  if(last > now) last.setUTCDate(last.getUTCDate() - 7);   // today is its day, but it hasn't fired yet
  if(now - last < 12*HOUR) return null;                    // give the run time to land
  const have = file ? (/^(\d{4}-\d{2}-\d{2})/.exec(file.name)||[])[1] : null;
  const due = last.toISOString().slice(0,10);
  return (have && have >= due) ? null : last.toLocaleDateString(undefined,{weekday:'long', timeZone:'UTC'});
}
// Markdown from the repo is trusted-ish, but it renders as HTML, so strip anything that could run. This hands back
// the sanitized nodes themselves, never a string: serializing clean markup and parsing it again is exactly how
// mutation XSS gets through (e.g. a <noscript> whose attribute text turns into live elements on the second parse).
function safeFragment(md){
  const t = document.createElement('template');
  t.innerHTML = marked.parse(md);
  // <noscript> and <template> go too: their contents parse differently depending on context, and nothing
  // in a report needs them.
  t.content.querySelectorAll('script,style,iframe,object,embed,form,input,link,meta,base,noscript,template').forEach(n=>n.remove());
  const okUrl = (v)=>{ const u = String(v).replace(/[\x00-\x20]/g,'').toLowerCase();
                       return /^(https?:|mailto:)/.test(u) || !/^[a-z][a-z0-9+.-]*:/.test(u); };
  t.content.querySelectorAll('*').forEach(el=>{
    for(const a of [...el.attributes]){
      const n = a.name.toLowerCase();
      if(n.startsWith('on') || n==='srcdoc' || n==='formaction') el.removeAttribute(a.name);
      else if((n==='href' || n==='src' || n==='xlink:href' || n==='action' || n==='data') && !okUrl(a.value)) el.removeAttribute(a.name);
    }
  });
  return t.content;
}
// Put the meta line and a sanitized write-up into the brief, moving the clean nodes in directly.
function renderReport(box, metaHtml, md){
  box.innerHTML = metaHtml;
  const article = document.createElement('article');
  article.className = 'report';
  article.append(safeFragment(md));
  box.append(article);
}

function settingsPanel(){
  const rows = [...Object.values(ROUTINES).filter(r=>r.id), WATCHER];
  return `<div class="brief-meta"><span>what runs on its own, and when</span></div>
    <table style="margin:18px 0"><thead><tr><th>Routine</th><th>Schedule</th><th class="r"></th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${esc(r.label)}</td><td>${esc(r.auto)}</td>
      <td class="num"><a href="https://claude.ai/code/routines/${esc(r.id)}" target="_blank" rel="noopener">open ↗</a></td></tr>`).join('')}
    </tbody></table>
    <p class="sub">Each link opens that routine, where you can pause it, change when it runs, or start one now. Everything else on this page is live from Sleeper and refreshes itself every two minutes.</p>`;
}

let currentBrief = null;                 // the tab the reader has open; survives refreshes
let articleCache = {key:null, md:''};    // the write-up's markdown, refetched only when GitHub says it changed
async function showBrief(type){
  currentBrief = type;
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected', t.dataset.type===type));
  const box = $('brief');
  if(type==='settings'){ box.innerHTML = settingsPanel(); return; }
  const r = ROUTINES[type], f = newestOf(type), missed = missedRun(type, f);
  const ghLink = `<a href="https://github.com/${CFG.repo}/tree/main/reports">read them on GitHub</a>`;
  const when = f ? esc(longDate(reportDate(f.name)) || f.name.replace('.md','')) : (reportFiles ? 'nothing yet' : 'couldn’t check for new write-ups');
  const meta = `<div class="brief-meta">
      <span>${when}${r.auto ? ' · '+esc(r.auto) : ''}${
        missed ? ` · <span class="missed">${esc(missed)}'s run left nothing here</span>` : ''}</span>
      ${r.id ? `<a class="runlink" href="https://claude.ai/code/routines/${esc(r.id)}" target="_blank" rel="noopener">Run fresh ↗</a>` : ''}
    </div>`;
  if(!f){
    box.innerHTML = meta + (reportFiles
      ? `<div class="empty">Nothing here yet.${r.id ? ' “Run fresh” starts one now; the write-up lands here a few minutes later.' : ''}</div>`
      : `<div class="empty">GitHub didn't answer, so this may be out of date — ${ghLink}.</div>`);
    return;
  }
  const key = f.sha || f.name;
  if(articleCache.key !== key){
    box.innerHTML = meta + `<div class="empty">Loading…</div>`;
    try{
      const res = await fetch(f.download_url); if(!res.ok) throw new Error(res.status);
      // The actions block is data for the card, not prose; it would read as noise in the write-up.
      articleCache = {key, md:(await res.text()).replace(/^```actions[ \t]*$[\s\S]*?^```[ \t]*$\n?/m, '')};
    }catch{ box.innerHTML = meta + `<div class="empty">This one wouldn't load — ${ghLink}.</div>`; return; }
    if(currentBrief !== type) return;      // the reader moved on while it was loading
  }
  renderReport(box, meta, articleCache.md);
}

/* ——— page ——— */
const FEED_NAMES = {matchups:'this week’s matchup', trendAdd:'who’s trending', trendDrop:'who’s trending',
                    schedule:'the NFL schedule (byes)', scores:'kickoff times', txnsNow:'league moves', txnsPrev:'last week’s moves'};
const ESSENTIAL = ['league','rosters','users','players'];
let rendered = false, inflight = null, lastLoad = 0;

function notice(text, detail){
  const n = $('notice');
  n.hidden = !text;
  n.textContent = text || '';
  if(detail) n.title = detail; else n.removeAttribute('title');
}

async function fetchAll(state){
  const wk = state.week || 1, L = `${API}/v1/league/${CFG.league}`;
  const feeds = {
    league:    cached('league', DAY, ()=>j(L), {persist:true}),
    rosters:   j(`${L}/rosters`),
    users:     cached('users', DAY, ()=>j(`${L}/users`), {persist:true}),
    matchups:  j(`${L}/matchups/${wk}`),
    trendAdd:  cached('trendAdd', 10*MIN, ()=>j(`${API}/v1/players/nfl/trending/add?lookback_hours=48&limit=200`)),
    trendDrop: cached('trendDrop', 10*MIN, ()=>j(`${API}/v1/players/nfl/trending/drop?lookback_hours=48&limit=200`)),
    players:   cached('players', HOUR, async()=>trimPlayers(await j(`${API}/v1/players/nfl`)), {persist:true}),
    schedule:  cached('schedule:'+state.season, 7*DAY, ()=>j(`${API}/schedule/nfl/regular/${state.season}`), {persist:true}),
    scores:    j(`${API}/scores/nfl/regular/${state.season}/${wk}`),
    txnsNow:   j(`${L}/transactions/${wk}`),
    txnsPrev:  wk>1 ? cached('txns:'+wk, Infinity, ()=>j(`${L}/transactions/${wk-1}`)) : Promise.resolve([]),
    // The compiled actions. Soft: no file yet is the normal state, and never a notice.
    actions:   fetchActions(`https://raw.githubusercontent.com/${CFG.repo}/main/reports/actions.json?t=${Date.now()}`),
  };
  const keys = Object.keys(feeds);
  const settled = await Promise.allSettled(keys.map(k=>feeds[k]));
  const got = {}, failed = {};
  keys.forEach((k,i)=>{ if(settled[i].status==='fulfilled') got[k] = settled[i].value; else failed[k] = settled[i].reason; });
  const dead = ESSENTIAL.filter(k=>failed[k]);
  if(dead.length) throw failed[dead[0]];
  return {got, failed};
}

function render(state, got, failed){
  const wk = state.week || 1;
  const {league, rosters, users, players} = got;
  const owner = Object.fromEntries(users.map(u=>[u.user_id,u.display_name]));
  const byId  = Object.fromEntries(rosters.map(r=>[r.roster_id,r]));
  const name  = (rid)=>owner[byId[rid]?.owner_id] || ('Team '+rid);
  const rec   = (rid)=>{const s=byId[rid]?.settings||{};return `${s.wins||0}–${s.losses||0}${s.ties?'–'+s.ties:''}`};
  const pf    = (r)=>(r.settings?.fpts||0) + (r.settings?.fpts_decimal||0)/100;
  const rostered = new Set(rosters.flatMap(r=>r.players||[]));
  const trendAdd  = got.trendAdd  ? Object.fromEntries(got.trendAdd.map(t=>[t.player_id,t.count]))  : null;
  const trendDrop = got.trendDrop ? Object.fromEntries(got.trendDrop.map(t=>[t.player_id,t.count])) : null;
  const byes  = got.schedule ? byeWeeks(got.schedule) : null;
  const games = got.scores ? gamesByTeam(got.scores) : null;
  const txns  = got.txnsNow ? [...got.txnsNow, ...(got.txnsPrev||[])]
      .filter(t=>t.type!=='commissioner' && t.status==='complete')
      .sort((a,b)=>(b.status_updated||0)-(a.status_updated||0)) : null;
  const me = byId[CFG.me];
  if(!me) throw new Error('roster '+CFG.me+' missing');
  const matchups = got.matchups || null;
  const mine = matchups ? matchups.find(m=>m.roster_id===CFG.me) : null;
  // A null matchup_id is a week with no game (playoff bye, eliminated, week 18) — not an opponent to go looking for.
  const opp  = mine && mine.matchup_id!=null ? matchups.find(m=>m.matchup_id===mine.matchup_id && m.roster_id!==CFG.me) : null;
  const slots = (league.roster_positions||[]).filter(s=>s!=='BN');
  const ppts = (m,id)=> m && m.players_points ? m.players_points[id] : null;
  const label = (p)=> gameLabel(games, byes, p.team, wk);

  /* 1 — do now: the routines' compiled moves, re-verified against the live rosters above,
        then the mechanical items this page works out for itself, under "Heads up". */
  const actionsDoc = got.actions || null;
  const ownerOf = (pid)=>{
    const r = rosters.find(x=>x.roster_id!==CFG.me && (x.players||[]).some(q=>String(q)===String(pid)));
    return r ? name(r.roster_id) : null;
  };
  const live = { week:wk,
    players:new Set((me.players||[]).map(String)), starters:(me.starters||[]).map(String),
    reserve:(me.reserve||[]).map(String), ownerOf, dismissed:dismissedSet() };
  // A malformed actions.json is a bad data file, not a reason to blank the whole page.
  const rawActions = actionsDoc && Array.isArray(actionsDoc.actions) ? actionsDoc.actions : [];
  const verified = resolveDependencies(rawActions.filter(a=>a && typeof a==='object').map(a=>{
    const src = actionsDoc.sources && actionsDoc.sources[a.source];
    const w = a.week!=null ? a.week : (src && src.week!=null ? src.week : actionsDoc.week);
    const item = {...a, week: w==null ? wk : w, id: a.id || `${a.source||'?'}:${a.kind}:${a.player||''}`};
    return {...item, ...actionState(item, live)};
  }));
  // A player the routines have already turned into an OPEN instruction doesn't also need a
  // heads-up. Alerts flagged `keep` (an injured starter) are never silenced this way.
  const spokenFor = new Set(verified
    .filter(i=>(i.state==='open' || i.state==='waiting') && i.player).map(i=>String(i.player)));
  const doNow = {
    ok: !!actionsDoc, week: wk, league: CFG.league,
    now: new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),
    items: verified,
    alerts: actionItems({me, players, games, byes, week:wk, txns, rostered, trendAdd, trendDrop, slots})
              .filter(a=>!(a.id && !a.keep && spokenFor.has(String(a.id)))),
    nextCheck: pickNextCheck(actionsDoc && actionsDoc.sources),
    drift: rosterDrifted(actionsDoc, me),
  };
  let html = renderDoNow(doNow);

  /* 2 — this week */
  if(matchups){
    const myStarters = (mine && mine.starters) || me.starters || [];
    const startSet = new Set(myStarters);
    const bench = (me.players||[]).filter(id=>!startSet.has(id)&&!(me.reserve||[]).includes(id)).map(id=>resolve(players,id)).filter(Boolean);
    const reserve = (me.reserve||[]).map(id=>resolve(players,id)).filter(Boolean);
    const cell = (p,pts,side)=>{
      if(!p) return `<div class="pcell ${side}"><span class="kick">—</span></div>`;
      const g = games ? games[p.team] : null;
      const inj = p.inj ? `<span class="badge ${/out|ir|pup|doubtful/i.test(p.inj)?'out':'q'}" title="${esc(p.inj)}">${esc(p.inj.slice(0,3).toUpperCase())}</span>` : '';
      return `<div class="pcell ${side}"><div class="pline"><span class="pname">${esc(p.name)}</span>${inj}
        <span class="ppts">${pts!=null?pts.toFixed(1):''}</span></div>
        <div class="kick ${g&&g.live?'live':''}">${esc(label(p))}</div></div>`;
    };
    html += `<section><h2>This week</h2>
      <p class="sub">${games ? 'Kickoffs in your local time. ' : ''}Points fill in as games run.</p>`;
    if(opp){
      html += `<div class="scorebug">
          <div class="side"><div class="team">${esc(name(CFG.me))}</div><div class="rec">${rec(CFG.me)}</div><div class="pts">${(mine.points||0).toFixed(1)}</div></div>
          <div class="vs">VS</div>
          <div class="side opp"><div class="team">${esc(name(opp.roster_id))}</div><div class="rec">${rec(opp.roster_id)}</div><div class="pts">${(opp.points||0).toFixed(1)}</div></div>
        </div>
        <div class="lineup">
        <div class="head"><div>${esc(name(CFG.me))} (you)</div><div></div><div class="r">${esc(name(opp.roster_id))}</div></div>`;
      slots.forEach((slot,i)=>{
        const a = resolve(players,myStarters[i]);
        const b = resolve(players,(opp.starters||[])[i]);
        html += `<div class="slotrow">${cell(a,ppts(mine,myStarters[i]),'')}<div class="slot">${esc(slot.replace('SUPER_FLEX','SFLX'))}</div>${cell(b,ppts(opp,(opp.starters||[])[i]),'opp')}</div>`;
      });
    }else{
      html += `<div class="lineup solo">
        <div class="nogame">No matchup this week.</div>
        <div class="head"><div></div><div>${esc(name(CFG.me))} (you)</div></div>`;
      slots.forEach((slot,i)=>{
        const a = resolve(players,myStarters[i]);
        html += `<div class="slotrow"><div class="slot">${esc(slot.replace('SUPER_FLEX','SFLX'))}</div>${cell(a,ppts(mine,myStarters[i]),'')}</div>`;
      });
    }
    html += `<div class="benchnote"><b>Bench:</b> ${bench.map(p=>esc(p.name)).join(' · ')||'—'}<br><b>IR:</b> ${reserve.length?reserve.map(p=>esc(p.name)).join(' · '):'empty'}</div>
    </div></section>`;
  }

  /* 3 — league activity */
  const movesHtml = (txns||[]).slice(0,12).map(t=>{
    const who = (t.roster_ids||[]).map(name).join(', ');
    const adds = Object.keys(t.adds||{}).map(id=>resolve(players,id)).filter(Boolean);
    const drops = Object.keys(t.drops||{}).map(id=>resolve(players,id)).filter(Boolean);
    const free = drops.filter(p=>!rostered.has(p.id));
    const bid = t.settings&&t.settings.waiver_bid!=null ? ` for $${t.settings.waiver_bid}` : '';
    return `<div class="move"><span class="who">${esc(who)}</span>
      <span class="did">${adds.length?`took <span class="in">${adds.map(p=>esc(p.name)).join(', ')}</span>${esc(bid)}`:''}${
        drops.length?`${adds.length?', let go of ':'let go of '}${drops.map(p=>esc(p.name)).join(', ')}`:''}
        ${free.length?` <span class="free">still free: ${free.map(p=>esc(p.name)).join(', ')}</span>`:''}</span>
      <span class="when">${t.status_updated?new Date(t.status_updated).toLocaleDateString(undefined,{month:'short',day:'numeric'}):''}</span></div>`;
  }).join('');
  html += `<section><h2>League activity</h2>
    <p class="sub">Every move the other eleven managers have made, newest first. Anyone marked still free is claimable.</p>
    <div class="feed">${txns ? (movesHtml || '<div class="allclear">Nobody has made a move yet.</div>')
                            : '<div class="allclear">Couldn’t load league moves just now.</div>'}</div></section>`;

  /* 4 — the brief */
  html += `<section><h2>The brief</h2>
    <p class="sub">The written analysis behind all of this. “Run fresh” starts a new one; it lands here a few minutes later.</p>
    <div class="tabs" role="tablist">${Object.entries(ROUTINES).map(([t,r])=>`<button class="tab" role="tab" data-type="${t}" aria-selected="false">${r.label}</button>`).join('')}<button class="tab" role="tab" data-type="settings" aria-selected="false">Routines</button></div>
    <div class="brief" id="brief"></div>
    <p class="sub" style="margin-top:12px">Something these don't cover — a trade offer to weigh, a what-if? <a href="https://claude.ai/code" target="_blank" rel="noopener">Open a session</a> on <b>the-nebulizer/gridiron</b> and ask.</p>
  </section>`;

  /* 5 — the season */
  const standings = rosters.slice().sort((x,y)=>(y.settings?.wins||0)-(x.settings?.wins||0) || pf(y)-pf(x));
  const budget = league.settings?.waiver_budget||0;
  const myPlayers = [...(me.starters||[]), ...(me.players||[])].filter((v,i,a)=>a.indexOf(v)===i).map(id=>resolve(players,id)).filter(Boolean);
  // IR players can't fill an active slot, so they don't count toward covering a bye.
  const activeRoster = myPlayers.filter(p=>!(me.reserve||[]).map(String).includes(String(p.id)));
  const byeRows = {};
  if(byes) myPlayers.forEach(p=>{ const w=byes[p.team]; if(w && w>=wk) (byeRows[w]=byeRows[w]||[]).push(p); });
  html += `<div class="cols">
    <section><h2>Standings</h2><p class="sub">FAAB is what each manager can still spend.</p>
    <table><thead><tr><th>Team</th><th class="r">Rec</th><th class="r">PF</th><th class="r">FAAB</th></tr></thead><tbody>
    ${standings.map(r=>`<tr class="${r.roster_id===CFG.me?'me':''}"><td>${esc(name(r.roster_id))}</td><td class="num">${rec(r.roster_id)}</td><td class="num">${pf(r).toFixed(2)}</td><td class="num">$${budget-(r.settings?.waiver_budget_used||0)}</td></tr>`).join('')}
    </tbody></table></section>
    <section><h2>Byes ahead</h2><p class="sub">Weeks where you'll be short-handed, and who's out. A week marked in red is one you can't field a legal lineup for.</p>
    <table><thead><tr><th>Week</th><th>Out</th><th class="r">Cover</th></tr></thead><tbody>
    ${!byes ? '<tr><td colspan="3">The NFL schedule didn’t load, so byes are unknown right now.</td></tr>'
      : Object.keys(byeRows).map(Number).sort((a,b)=>a-b).map(w=>{
          // Same matching the heads-up and the reports use: whether the week is coverable is
          // solved against the real slots, never guessed from which position is out.
          const gaps = emptySlots(slots||[], activeRoster.filter(p=>byes[p.team]!==w));
          return `<tr><td class="num" style="text-align:left">W${w}</td>
            <td>${byeRows[w].map(p=>esc(p.name)+' <span style="color:var(--chalk-dim)">'+esc(p.pos)+'</span>').join(', ')}</td>
            <td class="num">${gaps.length
              ? `<span class="missed">no ${gaps.map(g=>esc(prettySlot(g))).join(', no ')}</span>`
              : '<span class="dim">covered</span>'}</td></tr>`;
        }).join('') || '<tr><td colspan="3">No byes left this season.</td></tr>'}
    </tbody></table></section></div>`;

  $('app').innerHTML = html;
  rendered = true;
  wireDismiss(doNow);
  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>showBrief(t.dataset.type)));
  const newest = (reportFiles||[]).slice().sort((a,b)=>b.name.localeCompare(a.name))[0];
  showBrief(currentBrief || (newest ? (Object.keys(ROUTINES).find(t=>newest.name.includes('-'+t)) || 'waivers') : 'waivers'));

  // One plain line for whatever didn't come through; the exception text stays in the tooltip.
  const missing = [...new Set(Object.keys(failed).map(k=>FEED_NAMES[k]||k))];
  notice(missing.length ? `Some of Sleeper didn’t answer: ${missing.join(', ')}. Showing the rest.` : '',
         Object.values(failed).map(e=>e && e.message).join('\n'));
}

async function doLoad(){
  if(!rendered) $('app').innerHTML = '<div class="loading">Reading the field…</div>';
  try{
    const state = await cached('state', 15*MIN, ()=>j(`${API}/v1/state/nfl`));
    $('weekchip').innerHTML = `${esc(state.season)} SEASON · <b>WEEK ${state.week || 1}</b>`;
    const [{got, failed}] = await Promise.all([fetchAll(state), loadReports()]);
    render(state, got, failed);
    $('stamp').textContent = 'updated '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  }catch(e){
    if(!rendered){
      $('app').innerHTML = `<div class="error" title="${esc(e.message)}"><b>Couldn't reach Sleeper.</b><br><br>Everything on this page comes from them, so there's nothing to show until they answer.<br><br>Check your connection, then refresh.</div>`;
    }else{
      // Keep the last good page; just say the refresh didn't take.
      notice(`Couldn’t refresh at ${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} — showing the last good read.`, e.message);
    }
  }finally{ lastLoad = Date.now(); }
}
// One load at a time: the button, the timer and a tab coming back into view can't pile up.
function load(){ if(!inflight) inflight = doLoad().finally(()=>{ inflight = null; }); return inflight; }
$('refresh').addEventListener('click', load);
setInterval(()=>{ if(!document.hidden) load(); }, 2*MIN);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && Date.now()-lastLoad > 2*MIN) load(); });
load();
</script>
