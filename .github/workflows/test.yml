name: test
# The offline suite — every case in it is a bug that shipped once. It needs no
# network and no snapshot, so it runs on every push and pull request.
on:
  push:
  pull_request:
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
